      - name: Install the pinned OpenCode CLI
        if: steps.gate.outputs.dispatch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/opencode-linux-x64.tar.gz"
          curl -fsSL \
            -o "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          printf '%s  %s\n' "$OPENCODE_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 "${RUNNER_TEMP}/opencode" /usr/local/bin/opencode
          /usr/local/bin/opencode --version

      - name: Configure OpenCode for NVIDIA NIM
        id: opencode_config
        if: steps.gate.outputs.dispatch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          config_file="$RUNNER_TEMP/diagramweave-opencode.json"
          cat >"$config_file" <<'CONFIG'
          {
            "$schema": "https://opencode.ai/config.json",
            "enabled_providers": ["nvidia-nim"],
            "model": "nvidia-nim/nvidia/llama-3.3-nemotron-super-49b-v1.5",
            "small_model": "nvidia-nim/meta/llama-3.3-70b-instruct",
            "provider": {
              "nvidia-nim": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "https://integrate.api.nvidia.com/v1",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "nvidia/llama-3.3-nemotron-super-49b-v1.5": {
                    "name": "NVIDIA Llama 3.3 Nemotron Super 49B v1.5",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  },
                  "nvidia/nemotron-3-super-120b-a12b": {
                    "name": "NVIDIA Nemotron 3 Super 120B",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  },
                  "deepseek-ai/deepseek-v4-pro": {
                    "name": "DeepSeek V4 Pro (NIM)",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  },
                  "meta/llama-3.3-70b-instruct": {
                    "name": "Meta Llama 3.3 70B Instruct (NIM)",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  }
                }
              }
            }
          }
          CONFIG
          chmod 0600 "$config_file"
          echo "config_path=$config_file" >>"$GITHUB_OUTPUT"

      - name: Set up Node.js for exact repository verification
        if: steps.gate.outputs.dispatch == 'true'
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 24
          package-manager-cache: false

      - name: Capture trusted Git control plane
        id: trusted_git
        if: steps.gate.outputs.dispatch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          trusted_git_dir="$RUNNER_TEMP/diagramweave-trusted-git"
          trusted_git_home="$RUNNER_TEMP/diagramweave-trusted-git-home"
          rm -rf "$trusted_git_dir" "$trusted_git_home"
          mkdir -p "$trusted_git_dir" "$trusted_git_home"
          cp -- .git/config "$trusted_git_dir/config"
          cp -- .git/HEAD "$trusted_git_dir/HEAD"
          cp -a -- .git/refs "$trusted_git_dir/refs"
          cp -a -- .git/info "$trusted_git_dir/info"
          cp -a -- .git/hooks "$trusted_git_dir/hooks"
          if [ -f .git/packed-refs ]; then
            cp -- .git/packed-refs "$trusted_git_dir/packed-refs"
          fi
          trusted_head_sha="$(
            env -i \
              HOME="$trusted_git_home" \
              PATH=/usr/bin:/bin \
              LANG=C.UTF-8 \
              LC_ALL=C.UTF-8 \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_NO_REPLACE_OBJECTS=1 \
              /usr/bin/git -c core.hooksPath=/dev/null rev-parse HEAD
          )"
          if ! [[ "$trusted_head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The checked-out trusted head is malformed."
            exit 1
          fi
          echo "head_sha=$trusted_head_sha" >>"$GITHUB_OUTPUT"

      - name: Run the NVIDIA NIM development agent
        id: proposal
        if: steps.gate.outputs.dispatch == 'true'
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          EXECUTION_MODE: ${{ steps.gate.outputs.mode }}
          TRUSTED_HEAD_SHA: ${{ steps.trusted_git.outputs.head_sha }}
          OPENCODE_CONFIG_PATH: ${{ steps.opencode_config.outputs.config_path }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          agent_user="diagramweave-agent"
          trusted_path="/usr/local/bin:/usr/bin:/bin"
          trusted_git_home="$RUNNER_TEMP/diagramweave-trusted-git-home"
          prompt="$(cat "$RUNNER_TEMP/diagramweave-agent-prompt.md")"
          status=1
          completed_without_mutation=0
          candidate_index=0
          maximum_tracked_path_count=2048
          maximum_patch_bytes=67108864
          maximum_file_count=2048
          maximum_total_bytes=67108864

          trusted_git() {
            env -i \
              HOME="$trusted_git_home" \
              PATH="$trusted_path" \
              LANG=C.UTF-8 \
              LC_ALL=C.UTF-8 \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_NO_REPLACE_OBJECTS=1 \
              /usr/bin/git \
                -c core.hooksPath=/dev/null \
                -c core.fsmonitor=false \
                -c diff.external= \
                "$@"
          }

          cleanup_user_processes() {
            local isolated_user="$1"
            sudo pkill -KILL -u "$isolated_user" 2>/dev/null || true
            sleep 1
            if sudo pgrep -u "$isolated_user" >/dev/null 2>&1; then
              echo "::error::A detached background process survived the isolated boundary."
              return 1
            fi
          }

          restore_git_control_plane() {
            local proposal_root="$1"
            local snapshot_root="$2"
            rm -rf "$proposal_root/.git"
            cp -a -- "$snapshot_root" "$proposal_root/.git"
            test -f "$proposal_root/.git/config"
            test -f "$proposal_root/.git/HEAD"
            test -d "$proposal_root/.git/refs"
            test -d "$proposal_root/.git/info"
            test -d "$proposal_root/.git/hooks"
            rm -f \
              "$proposal_root/.git/info/grafts" \
              "$proposal_root/.git/objects/info/alternates"
            rm -rf "$proposal_root/.git/refs/replace"
            trusted_git -C "$proposal_root" reset --mixed "$TRUSTED_HEAD_SHA"
            observed_head_sha="$(trusted_git -C "$proposal_root" rev-parse HEAD)"
            if [ "$observed_head_sha" != "$TRUSTED_HEAD_SHA" ]; then
              echo "::error::Disposable clone Git control plane did not restore exactly."
              return 1
            fi
          }

          write_manifest_helper() {
            cat >"$RUNNER_TEMP/diagramweave-proposal-tools.py" <<'PY'
          import argparse
          import hashlib
          import json
          import os
          import shutil
          import stat
          from pathlib import Path


          def read_paths(path: Path) -> list[str]:
              return [
                  os.fsdecode(value)
                  for value in path.read_bytes().split(b"\0")
                  if value
              ]


          def safe_relative_path(value: str) -> Path:
              relative = Path(value)
              if (
                  relative.is_absolute()
                  or not relative.parts
                  or any(part in {"", ".", "..", ".git"} for part in relative.parts)
              ):
                  raise SystemExit("proposal contains an unsafe path")
              return relative


          def file_hash(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()


          def validate_regular(root: Path, relative: Path) -> tuple[Path, os.stat_result]:
              cursor = root
              for part in relative.parts:
                  cursor = cursor.joinpath(part)
                  if cursor.is_symlink():
                      raise SystemExit("proposal contains a symbolic link")
              source = root.joinpath(relative)
              if source.is_symlink() or not source.is_file():
                  raise SystemExit("proposal contains a non-regular file")
              source_stat = source.stat()
              if not stat.S_ISREG(source_stat.st_mode):
                  raise SystemExit("proposal contains a non-regular file")
              return source, source_stat


          def manifest(args: argparse.Namespace) -> None:
              root = Path(args.root)
              cached = read_paths(Path(args.cached))
              untracked = [
                  value
                  for value in read_paths(Path(args.untracked))
                  if value != "PR_MESSAGE.md"
              ]
              if len(untracked) > args.maximum_file_count:
                  raise SystemExit("proposal contains too many untracked files")
              if len(cached) + len(untracked) > args.maximum_path_count:
                  raise SystemExit("proposal contains too many source paths")

              seen: set[str] = set()
              entries: list[dict[str, object]] = []
              total_bytes = 0
              secret = os.environ.get("PROPOSAL_SECRET", "").encode()
              for kind, values in (("tracked", cached), ("untracked", untracked)):
                  for value in values:
                      relative = safe_relative_path(value)
                      canonical = relative.as_posix()
                      if canonical in seen:
                          raise SystemExit("proposal contains a duplicate path")
                      seen.add(canonical)
                      source = root.joinpath(relative)
                      if kind == "tracked" and not source.exists():
                          entries.append({"kind": "deleted", "path": canonical})
                          continue
                      source, source_stat = validate_regular(root, relative)
                      total_bytes += source_stat.st_size
                      if total_bytes > args.maximum_total_bytes:
                          raise SystemExit("proposal exceeds the source-byte budget")
                      if secret:
                          with source.open("rb") as handle:
                              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                                  if secret in chunk:
                                      raise SystemExit(
                                          "secret exfiltration detected in proposal content"
                                      )
                      entries.append(
                          {
                              "kind": "file",
                              "mode": "0755" if source_stat.st_mode & 0o111 else "0644",
                              "path": canonical,
                              "sha256": file_hash(source),
                              "size": source_stat.st_size,
                          }
                      )
              entries.sort(key=lambda item: str(item["path"]).encode("utf-8"))
              payload = json.dumps(
                  entries,
                  ensure_ascii=False,
                  separators=(",", ":"),
                  sort_keys=True,
              ).encode("utf-8") + b"\n"
              output = Path(args.output)
              output.write_bytes(payload)
              print(hashlib.sha256(payload).hexdigest())


          def copy_untracked(args: argparse.Namespace) -> None:
              root = Path(args.root)
              destination = Path(args.destination)
              values = read_paths(Path(args.untracked))
              if len(values) > args.maximum_file_count:
                  raise SystemExit("proposal contains too many untracked files")
              total_bytes = 0
              for value in values:
                  relative = safe_relative_path(value)
                  source, source_stat = validate_regular(root, relative)
                  total_bytes += source_stat.st_size
                  if total_bytes > args.maximum_total_bytes:
                      raise SystemExit("proposal exceeds the untracked-byte budget")
                  target = destination.joinpath(relative)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  temporary = target.with_name(f".{target.name}.proposal-copy")
                  shutil.copyfile(source, temporary)
                  os.chmod(temporary, 0o755 if source_stat.st_mode & 0o111 else 0o644)
                  os.replace(temporary, target)


          parser = argparse.ArgumentParser()
          subparsers = parser.add_subparsers(dest="command", required=True)
          manifest_parser = subparsers.add_parser("manifest")
          manifest_parser.add_argument("--root", required=True)
          manifest_parser.add_argument("--cached", required=True)
          manifest_parser.add_argument("--untracked", required=True)
          manifest_parser.add_argument("--output", required=True)
          manifest_parser.add_argument("--maximum-path-count", type=int, required=True)
          manifest_parser.add_argument("--maximum-file-count", type=int, required=True)
          manifest_parser.add_argument("--maximum-total-bytes", type=int, required=True)
          manifest_parser.set_defaults(function=manifest)
          copy_parser = subparsers.add_parser("copy-untracked")
          copy_parser.add_argument("--root", required=True)
          copy_parser.add_argument("--untracked", required=True)
          copy_parser.add_argument("--destination", required=True)
          copy_parser.add_argument("--maximum-file-count", type=int, required=True)
          copy_parser.add_argument("--maximum-total-bytes", type=int, required=True)
          copy_parser.set_defaults(function=copy_untracked)
          arguments = parser.parse_args()
          arguments.function(arguments)
          PY
            chmod 0700 "$RUNNER_TEMP/diagramweave-proposal-tools.py"
          }

          build_proposal_bundle() {
            local proposal_root="$1"
            local candidate_number="$2"
            local bundle_dir="$RUNNER_TEMP/diagramweave-proposal-${candidate_number}"
            rm -rf "$bundle_dir"
            mkdir -p "$bundle_dir/untracked"

            trusted_git -C "$proposal_root" \
              diff --name-only -z "$TRUSTED_HEAD_SHA" -- \
              >"$bundle_dir/tracked-paths.z"
            tracked_path_count="$(
              BUNDLE_FILE="$bundle_dir/tracked-paths.z" python3 - <<'PY'
          import os
          from pathlib import Path
          print(sum(bool(value) for value in Path(os.environ["BUNDLE_FILE"]).read_bytes().split(b"\0")))
          PY
            )"
            if [ "$tracked_path_count" -gt "$maximum_tracked_path_count" ]; then
              echo "::error::Agent proposal changes too many tracked paths."
              return 1
            fi
            if trusted_git -C "$proposal_root" diff --summary "$TRUSTED_HEAD_SHA" -- \
              | grep -E '(create mode|mode change).*120000' >/dev/null; then
              echo "::error::Agent proposals cannot create symbolic links."
              return 1
            fi

            # Trusted equivalent of: git diff --binary --full-index
            trusted_git -C "$proposal_root" \
              diff --binary --full-index --no-ext-diff --no-textconv --no-renames \
              "$TRUSTED_HEAD_SHA" -- >"$bundle_dir/proposal.patch"
            patch_bytes="$(wc -c <"$bundle_dir/proposal.patch")"
            if [ "$patch_bytes" -gt "$maximum_patch_bytes" ]; then
              echo "::error::Agent proposal patch exceeds the byte budget."
              return 1
            fi

            trusted_git -C "$proposal_root" ls-files --cached -z \
              >"$bundle_dir/cached.z"
            # Trusted equivalent of: git ls-files --others --exclude-standard -z
            trusted_git -C "$proposal_root" \
              ls-files --others --exclude-standard -z \
              >"$bundle_dir/untracked.z"
            python3 "$RUNNER_TEMP/diagramweave-proposal-tools.py" copy-untracked \
              --root "$proposal_root" \
              --untracked "$bundle_dir/untracked.z" \
              --destination "$bundle_dir/untracked" \
              --maximum-file-count "$maximum_file_count" \
              --maximum-total-bytes "$maximum_total_bytes"
            proposal_manifest_sha256="$(
              PROPOSAL_SECRET="$NVIDIA_API_KEY" \
                python3 "$RUNNER_TEMP/diagramweave-proposal-tools.py" manifest \
                  --root "$proposal_root" \
                  --cached "$bundle_dir/cached.z" \
                  --untracked "$bundle_dir/untracked.z" \
                  --output "$bundle_dir/proposal-manifest.json" \
                  --maximum-path-count "$maximum_tracked_path_count" \
                  --maximum-file-count "$maximum_file_count" \
                  --maximum-total-bytes "$maximum_total_bytes"
            )"
            if ! [[ "$proposal_manifest_sha256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::The proposal manifest SHA-256 is malformed."
              return 1
            fi
            {
              echo "mutation=true"
              echo "bundle_dir=$bundle_dir"
              echo "proposal_manifest_sha256=$proposal_manifest_sha256"
              echo "proposal_tree_hash=$proposal_manifest_sha256"
            } >>"$GITHUB_OUTPUT"
          }

          chmod 0700 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          for command_file in \
            "${GITHUB_ENV:-}" \
            "${GITHUB_PATH:-}" \
            "${GITHUB_OUTPUT:-}" \
            "${GITHUB_STATE:-}" \
            "${GITHUB_STEP_SUMMARY:-}"; do
            if [ -n "$command_file" ] && [ -e "$command_file" ]; then
              chmod 0600 "$command_file"
              chmod 0700 "$(dirname "$command_file")"
            fi
          done
          write_manifest_helper

          if ! id -u "$agent_user" >/dev/null 2>&1; then
            sudo useradd \
              --system \
              --no-create-home \
              --shell /usr/sbin/nologin \
              "$agent_user"
          fi
          trap 'cleanup_user_processes "$agent_user" || true' EXIT

          for model in $OPENCODE_MODEL_CANDIDATES; do
            candidate_index=$((candidate_index + 1))
            candidate_root="/tmp/diagramweave-agent-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${candidate_index}"
            proposal_root="$candidate_root/repository"
            model_home="$candidate_root/home"
            model_tmp="$candidate_root/tmp"
            evidence_root="$candidate_root/evidence"
            proposal_git_snapshot="$RUNNER_TEMP/diagramweave-proposal-git-${candidate_index}"

            sudo rm -rf "$candidate_root"
            rm -rf "$proposal_git_snapshot"
            install -d -m 0700 "$candidate_root" "$model_home" "$model_tmp"
            trusted_git \
              -c protocol.file.allow=always \
              clone --no-hardlinks --no-tags "$GITHUB_WORKSPACE" "$proposal_root"
            trusted_git -C "$proposal_root" checkout --detach "$TRUSTED_HEAD_SHA"
            trusted_git -C "$proposal_root" remote remove origin
            printf '/opencode.json\n' >>"$proposal_root/.git/info/exclude"
            cp -- "$OPENCODE_CONFIG_PATH" "$proposal_root/opencode.json"
            if [ "$EXECUTION_MODE" = "remediation" ]; then
              cp -a -- "$RUNNER_TEMP/diagramweave-pr-evidence" "$evidence_root"
              candidate_prompt="${prompt//$RUNNER_TEMP\/diagramweave-pr-evidence/$evidence_root}"
            else
              candidate_prompt="$prompt"
            fi
            cp -a -- "$proposal_root/.git" "$proposal_git_snapshot"
            sudo chown -R "$agent_user:$agent_user" "$candidate_root"

            echo "::group::opencode $model"
            model_succeeded=false
            if (
              cd "$proposal_root"
              sudo -u "$agent_user" \
                /usr/bin/env -i \
                  HOME="$model_home" \
                  TMPDIR="$model_tmp" \
                  XDG_CONFIG_HOME="$model_home/.config" \
                  XDG_CACHE_HOME="$model_home/.cache" \
                  XDG_DATA_HOME="$model_home/.local/share" \
                  XDG_STATE_HOME="$model_home/.local/state" \
                  PATH="$trusted_path" \
                  NVIDIA_API_KEY="$NVIDIA_API_KEY" \
                  CI=true \
                  LANG=C.UTF-8 \
                  LC_ALL=C.UTF-8 \
                  TERM=dumb \
                  /usr/bin/timeout \
                    --kill-after=30s \
                    "${OPENCODE_RUN_TIMEOUT_SECONDS}s" \
                    /usr/local/bin/opencode run "$candidate_prompt" --model "$model"
            ); then
              model_succeeded=true
            fi
            echo "::endgroup::"

            cleanup_user_processes "$agent_user"
            sudo chown -R "$(id -u):$(id -g)" "$candidate_root"
            chmod -R u+rwX "$candidate_root"
            restore_git_control_plane "$proposal_root" "$proposal_git_snapshot"
            rm -f "$proposal_root/opencode.json"

            proposal_status="$(
              trusted_git -C "$proposal_root" \
                status --porcelain --untracked-files=all
            )"
            meaningful_status="$(
              printf '%s\n' "$proposal_status" \
                | grep -vE '^\?\? PR_MESSAGE\.md$' || true
            )"

            if [ "$model_succeeded" = "true" ] && [ -n "$meaningful_status" ]; then
              if build_proposal_bundle "$proposal_root" "$candidate_index"; then
                status=0
                echo "Agent session produced a bounded repository mutation with \`$model\`." \
                  >>"$GITHUB_STEP_SUMMARY"
                rm -rf "$candidate_root" "$proposal_git_snapshot"
                break
              fi
              echo "::warning::Model $model produced an unsafe proposal; discarding it and trying the next candidate."
            elif [ "$model_succeeded" = "true" ]; then
              completed_without_mutation=$((completed_without_mutation + 1))
              echo "::warning::Model $model completed without a repository mutation; trying the next candidate."
            else
              echo "::warning::Model $model failed; discarding partial work and trying the next candidate."
            fi

            (
              cd "$proposal_root"
              trusted_git reset --hard HEAD
              trusted_git clean -fd
            )
            rm -rf "$candidate_root" "$proposal_git_snapshot"
          done

          cleanup_user_processes "$agent_user"
          trap - EXIT
          sudo userdel "$agent_user"

          if [ "$status" -ne 0 ]; then
            echo "mutation=false" >>"$GITHUB_OUTPUT"
            if [ "$EXECUTION_MODE" = "remediation" ] && \
               [ "$completed_without_mutation" -gt 0 ]; then
              echo "Every candidate failed or completed without a safe remediation mutation; leaving the exact head unchanged after candidate exhaustion." \
                >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::Every NVIDIA NIM model candidate failed or completed without a product mutation; no product increment was proposed."
            exit 1
          fi

      - name: Verify the proposed mutation in an isolated clone
        id: isolated_verify
        if: steps.gate.outputs.dispatch == 'true' && steps.proposal.outputs.mutation == 'true'
        shell: bash
        env:
          PROPOSAL_BUNDLE_DIR: ${{ steps.proposal.outputs.bundle_dir }}
          PROPOSAL_MANIFEST_SHA256: ${{ steps.proposal.outputs.proposal_manifest_sha256 }}
          TRUSTED_HEAD_SHA: ${{ steps.trusted_git.outputs.head_sha }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          verifier_user="diagramweave-verifier"
          trusted_git_home="$RUNNER_TEMP/diagramweave-trusted-git-home"
          trusted_path="$PATH"
          verifier_root="/tmp/diagramweave-verifier-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          verifier_repository="$verifier_root/repository"
          verifier_home="$verifier_root/home"
          verifier_tmp="$verifier_root/tmp"
          bundle_dir="$PROPOSAL_BUNDLE_DIR"
          maximum_tracked_path_count=2048
          maximum_file_count=2048
          maximum_total_bytes=67108864

          trusted_git() {
            env -i \
              HOME="$trusted_git_home" \
              PATH=/usr/bin:/bin \
              LANG=C.UTF-8 \
              LC_ALL=C.UTF-8 \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_NO_REPLACE_OBJECTS=1 \
              /usr/bin/git \
                -c core.hooksPath=/dev/null \
                -c core.fsmonitor=false \
                -c diff.external= \
                "$@"
          }

          cleanup_verifier_processes() {
            sudo pkill -KILL -u "$verifier_user" 2>/dev/null || true
            sleep 1
            if sudo pgrep -u "$verifier_user" >/dev/null 2>&1; then
              echo "::error::A detached verifier process survived isolated verification."
              return 1
            fi
          }

          compute_manifest() {
            local root="$1"
            local prefix="$2"
            trusted_git -C "$root" ls-files --cached -z >"${prefix}-cached.z"
            trusted_git -C "$root" \
              ls-files --others --exclude-standard -z >"${prefix}-untracked.z"
            python3 "$RUNNER_TEMP/diagramweave-proposal-tools.py" manifest \
              --root "$root" \
              --cached "${prefix}-cached.z" \
              --untracked "${prefix}-untracked.z" \
              --output "${prefix}-manifest.json" \
              --maximum-path-count "$maximum_tracked_path_count" \
              --maximum-file-count "$maximum_file_count" \
              --maximum-total-bytes "$maximum_total_bytes"
          }

          if ! id -u "$verifier_user" >/dev/null 2>&1; then
            sudo useradd \
              --system \
              --no-create-home \
              --shell /usr/sbin/nologin \
              "$verifier_user"
          fi
          trap 'cleanup_verifier_processes || true' EXIT
          sudo rm -rf "$verifier_root"
          install -d -m 0700 "$verifier_root" "$verifier_home" "$verifier_tmp"
          trusted_git \
            -c protocol.file.allow=always \
            clone --no-hardlinks --no-tags "$GITHUB_WORKSPACE" "$verifier_repository"
          trusted_git -C "$verifier_repository" checkout --detach "$TRUSTED_HEAD_SHA"
          trusted_git -C "$verifier_repository" remote remove origin
          if [ -s "$bundle_dir/proposal.patch" ]; then
            # Trusted equivalent of: git apply --binary
            trusted_git -C "$verifier_repository" \
              apply --binary --whitespace=nowarn "$bundle_dir/proposal.patch"
          fi
          if [ -d "$bundle_dir/untracked" ]; then
            cp -a -- "$bundle_dir/untracked/." "$verifier_repository/"
          fi

          before_manifest_sha256="$(
            compute_manifest "$verifier_repository" \
              "$RUNNER_TEMP/diagramweave-verifier-before"
          )"
          if [ "$before_manifest_sha256" != "$PROPOSAL_MANIFEST_SHA256" ]; then
            echo "::error::Isolated verification input does not match the proposal manifest."
            exit 1
          fi

          sudo chown -R "$verifier_user:$verifier_user" "$verifier_root"
          if ! (
            cd "$verifier_repository"
            sudo -u "$verifier_user" \
              /usr/bin/env -i \
                HOME="$verifier_home" \
                TMPDIR="$verifier_tmp" \
                XDG_CONFIG_HOME="$verifier_home/.config" \
                XDG_CACHE_HOME="$verifier_home/.cache" \
                XDG_DATA_HOME="$verifier_home/.local/share" \
                XDG_STATE_HOME="$verifier_home/.local/state" \
                PATH="$trusted_path" \
                CI=true \
                LANG=C.UTF-8 \
                LC_ALL=C.UTF-8 \
                TERM=dumb \
                bash -c '
                  set -euo pipefail
                  npm ci --ignore-scripts --no-audit --no-fund
                  npm run verify
                  node scripts/check-package-contents.mjs
                '
          ); then
            echo "::error::The isolated verifier rejected the proposal."
            exit 1
          fi
          cleanup_verifier_processes
          sudo chown -R "$(id -u):$(id -g)" "$verifier_root"
          chmod -R u+rwX "$verifier_root"

          after_manifest_sha256="$(
            compute_manifest "$verifier_repository" \
              "$RUNNER_TEMP/diagramweave-verifier-after"
          )"
          if [ "$after_manifest_sha256" != "$PROPOSAL_MANIFEST_SHA256" ]; then
            echo "::error::Source mutation during verification changed the proposal tree."
            exit 1
          fi
          verification_manifest_sha256="$after_manifest_sha256"
          verified_tree_hash="$after_manifest_sha256"
          {
            echo "proposal_manifest_sha256=$PROPOSAL_MANIFEST_SHA256"
            echo "verification_manifest_sha256=$verification_manifest_sha256"
            echo "verified_tree_hash=$verified_tree_hash"
          } >>"$GITHUB_OUTPUT"

          cleanup_verifier_processes
          trap - EXIT
          sudo userdel "$verifier_user"
          rm -rf "$verifier_root"

      - name: Import the verified bounded proposal
        id: import_verified
        if: steps.gate.outputs.dispatch == 'true'
        shell: bash
        env:
          EXECUTION_MODE: ${{ steps.gate.outputs.mode }}
          PROPOSAL_MUTATION: ${{ steps.proposal.outputs.mutation }}
          PROPOSAL_BUNDLE_DIR: ${{ steps.proposal.outputs.bundle_dir }}
          PROPOSAL_MANIFEST_SHA256: ${{ steps.proposal.outputs.proposal_manifest_sha256 }}
          VERIFICATION_MANIFEST_SHA256: ${{ steps.isolated_verify.outputs.verification_manifest_sha256 }}
          VERIFIED_TREE_HASH: ${{ steps.isolated_verify.outputs.verified_tree_hash }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          trusted_git_home="$RUNNER_TEMP/diagramweave-trusted-git-home"
          maximum_tracked_path_count=2048
          maximum_file_count=2048
          maximum_total_bytes=67108864

          trusted_git() {
            env -i \
              HOME="$trusted_git_home" \
              PATH=/usr/bin:/bin \
              LANG=C.UTF-8 \
              LC_ALL=C.UTF-8 \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_NO_REPLACE_OBJECTS=1 \
              /usr/bin/git -c core.hooksPath=/dev/null "$@"
          }

          if [ "$PROPOSAL_MUTATION" != "true" ]; then
            echo "mutation=false" >>"$GITHUB_OUTPUT"
            if [ "$EXECUTION_MODE" = "product" ]; then
              echo "::error::Product-development mode completed without a repository mutation."
              echo "A clean model exit is not a completed product increment." \
                >>"$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "No safe remediation mutation was produced after candidate exhaustion." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$PROPOSAL_MANIFEST_SHA256" != "$VERIFICATION_MANIFEST_SHA256" ] || \
             [ "$PROPOSAL_MANIFEST_SHA256" != "$VERIFIED_TREE_HASH" ]; then
            echo "::error::Proposal and isolated-verification manifests disagree."
            exit 1
          fi

          if [ -s "$PROPOSAL_BUNDLE_DIR/proposal.patch" ]; then
            # Trusted equivalent of: git apply --binary
            trusted_git apply --binary --whitespace=nowarn \
              "$PROPOSAL_BUNDLE_DIR/proposal.patch"
          fi
          if [ -d "$PROPOSAL_BUNDLE_DIR/untracked" ]; then
            cp -a -- "$PROPOSAL_BUNDLE_DIR/untracked/." "$GITHUB_WORKSPACE/"
          fi

          trusted_git ls-files --cached -z \
            >"$RUNNER_TEMP/diagramweave-import-cached.z"
          trusted_git ls-files --others --exclude-standard -z \
            >"$RUNNER_TEMP/diagramweave-import-untracked.z"
          imported_tree_hash="$(
            python3 "$RUNNER_TEMP/diagramweave-proposal-tools.py" manifest \
              --root "$GITHUB_WORKSPACE" \
              --cached "$RUNNER_TEMP/diagramweave-import-cached.z" \
              --untracked "$RUNNER_TEMP/diagramweave-import-untracked.z" \
              --output "$RUNNER_TEMP/diagramweave-import-manifest.json" \
              --maximum-path-count "$maximum_tracked_path_count" \
              --maximum-file-count "$maximum_file_count" \
              --maximum-total-bytes "$maximum_total_bytes"
          )"
          if [ "$imported_tree_hash" != "$VERIFIED_TREE_HASH" ]; then
            echo "::error::Trusted import does not match the isolated verified tree."
            exit 1
          fi
          echo "mutation=true" >>"$GITHUB_OUTPUT"
          echo "imported_tree_hash=$imported_tree_hash" >>"$GITHUB_OUTPUT"

      - name: Prepare one bounded commit without repository credentials
        id: prepare_commit
        if: steps.gate.outputs.dispatch == 'true' && steps.import_verified.outputs.mutation == 'true'
        shell: bash
        env:
          EXECUTION_MODE: ${{ steps.gate.outputs.mode }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          trusted_git_home="$RUNNER_TEMP/diagramweave-trusted-git-home"
          title_file="$RUNNER_TEMP/pr-title.txt"
          body_file="$RUNNER_TEMP/pr-body.md"

          trusted_git() {
            env -i \
              HOME="$trusted_git_home" \
              PATH=/usr/bin:/bin \
              LANG=C.UTF-8 \
              LC_ALL=C.UTF-8 \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_NO_REPLACE_OBJECTS=1 \
              /usr/bin/git -c core.hooksPath=/dev/null "$@"
          }

          title="fix: apply RCA-backed PR remediation"
          : >"$body_file"
          if [ "$EXECUTION_MODE" = "product" ]; then
            title="DiagramWeave autonomous product increment"
            if [ -f PR_MESSAGE.md ]; then
              candidate_title="$(head -n 1 PR_MESSAGE.md | sed 's/^#\+ *//')"
              [ -n "$candidate_title" ] && title="$candidate_title"
              tail -n +2 PR_MESSAGE.md >"$body_file"
            else
              echo "Autonomous NVIDIA NIM increment; see the diff and CHANGELOG.md." \
                >"$body_file"
            fi
          fi
          rm -f PR_MESSAGE.md

          if [ -z "$title" ] || [ "${#title}" -gt 200 ]; then
            echo "::error::The proposed commit title is empty or oversized."
            exit 1
          fi
          if printf '%s' "$title" | LC_ALL=C grep -q '[[:cntrl:]]'; then
            echo "::error::The proposed commit title contains control characters."
            exit 1
          fi
          if [ "$(wc -c <"$body_file")" -gt 131072 ]; then
            echo "::error::The proposed pull-request body is oversized."
            exit 1
          fi
          printf '%s\n' "$title" >"$title_file"

          trusted_git add -A
          trusted_git diff --cached --check
          if trusted_git diff --cached --quiet; then
            echo "::error::Verification reported a mutation but no commit content remains."
            exit 1
          fi
          # Trusted equivalent of: git commit --no-verify
          trusted_git \
            -c user.name=github-actions[bot] \
            -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit --no-verify -m "$title"
          commit_sha="$(trusted_git rev-parse HEAD)"
          if ! [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The prepared commit SHA is malformed."
            exit 1
          fi
          {
            echo "commit_sha=$commit_sha"
            echo "title_file=$title_file"
            echo "body_file=$body_file"
          } >>"$GITHUB_OUTPUT"

      - name: Publish one bounded mutation
        if: steps.gate.outputs.dispatch == 'true' && steps.import_verified.outputs.mutation == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_MODE: ${{ steps.gate.outputs.mode }}
          TARGET_PR_NUMBER: ${{ steps.gate.outputs.target_pr_number }}
          TARGET_HEAD_BRANCH: ${{ steps.gate.outputs.target_head_branch }}
          TARGET_HEAD_SHA: ${{ steps.gate.outputs.target_head_sha }}
          PREPARED_COMMIT_SHA: ${{ steps.prepare_commit.outputs.commit_sha }}
          PREPARED_TITLE_FILE: ${{ steps.prepare_commit.outputs.title_file }}
          PREPARED_BODY_FILE: ${{ steps.prepare_commit.outputs.body_file }}
          TRUSTED_HEAD_SHA: ${{ steps.trusted_git.outputs.head_sha }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          trusted_git_home="$RUNNER_TEMP/diagramweave-trusted-git-home"

          trusted_git() {
            env -i \
              HOME="$trusted_git_home" \
              PATH=/usr/bin:/bin \
              LANG=C.UTF-8 \
              LC_ALL=C.UTF-8 \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_NO_REPLACE_OBJECTS=1 \
              /usr/bin/git -c core.hooksPath=/dev/null "$@"
          }

          if id -u diagramweave-agent >/dev/null 2>&1 || \
             id -u diagramweave-verifier >/dev/null 2>&1; then
            echo "::error::An isolated model or verifier user survived into publication."
            exit 1
          fi
          prepared_commit_sha="$PREPARED_COMMIT_SHA"
          if ! [[ "$prepared_commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The prepared commit SHA is malformed."
            exit 1
          fi
          if [ "$(trusted_git rev-parse HEAD)" != "$prepared_commit_sha" ]; then
            echo "::error::The local HEAD no longer matches the verified prepared commit."
            exit 1
          fi

          git_basic_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git_auth_header="AUTHORIZATION: basic $git_basic_auth"
          echo "::add-mask::$git_basic_auth"
          echo "::add-mask::$git_auth_header"

          if [ "$EXECUTION_MODE" = "remediation" ]; then
            expected_head_sha="$TARGET_HEAD_SHA"
            target_head_branch="$TARGET_HEAD_BRANCH"
            if ! trusted_git check-ref-format "refs/heads/$target_head_branch" >/dev/null; then
              echo "::error::The selected PR head branch is not a safe Git ref."
              exit 1
            fi
            remote_head_sha="$(
              gh pr view "$TARGET_PR_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --json headRefOid \
                --jq '.headRefOid'
            )"
            if [ "$remote_head_sha" != "$expected_head_sha" ]; then
              echo "::error::The PR head moved during remediation; refusing a stale push."
              exit 1
            fi

            # Trusted equivalent of: git push --no-verify
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_0="$git_auth_header" \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_NO_REPLACE_OBJECTS=1 \
              HOME="$trusted_git_home" \
              /usr/bin/git -c core.hooksPath=/dev/null push --no-verify \
                "https://github.com/${GITHUB_REPOSITORY}.git" \
                "$prepared_commit_sha:refs/heads/${target_head_branch}"

            remote_head_sha="$(
              gh pr view "$TARGET_PR_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --json headRefOid \
                --jq '.headRefOid'
            )"
            if [ "$remote_head_sha" != "$prepared_commit_sha" ]; then
              echo "::error::Post-push exact-head verification failed."
              exit 1
            fi
            gh pr view "$TARGET_PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json headRefOid,mergeStateStatus,reviewDecision,statusCheckRollup \
              >"$RUNNER_TEMP/post-remediation-state.json"
            echo "Published one verified fast-forward remediation commit to PR #$TARGET_PR_NUMBER." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          latest_open_prs="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 1 \
              --json number,url
          )"
          if [ "$(jq 'length' <<<"$latest_open_prs")" -ne 0 ]; then
            echo "::error::A pull request appeared after the gate; refusing duplicate product work."
            exit 1
          fi
          current_base_sha="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" \
              --jq '.object.sha'
          )"
          if [ "$current_base_sha" != "$TRUSTED_HEAD_SHA" ]; then
            echo "::error::Protected main moved during product development; refusing stale product work."
            exit 1
          fi

          title="$(cat "$PREPARED_TITLE_FILE")"
          body_file="$PREPARED_BODY_FILE"
          branch="nim-agent/product-dev-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! trusted_git check-ref-format "refs/heads/$branch" >/dev/null; then
            echo "::error::The product proposal branch is not a safe Git ref."
            exit 1
          fi

          # Trusted equivalent of: git push --no-verify
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="$git_auth_header" \
            GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_GLOBAL=/dev/null \
            GIT_NO_REPLACE_OBJECTS=1 \
            HOME="$trusted_git_home" \
            /usr/bin/git -c core.hooksPath=/dev/null push --no-verify \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              "$prepared_commit_sha:refs/heads/${branch}"
          pr_url="$(
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "$title" \
              --body-file "$body_file"
          )"
          created_head_sha="$(
            gh pr view "$pr_url" \
              --repo "$GITHUB_REPOSITORY" \
              --json headRefOid \
              --jq '.headRefOid'
          )"
          if [ "$created_head_sha" != "$prepared_commit_sha" ]; then
            echo "::error::Created PR does not point to the verified commit."
            exit 1
          fi
          {
            echo "Opened exactly one bounded pull request: $pr_url"
            echo "Central PR governance owns review, repair, revalidation, and merge."
          } >>"$GITHUB_STEP_SUMMARY"
