name: Run declaration-hover product integration

on:
  push:
    branches:
      - agent/evidence-bounded-declaration-hover
    paths:
      - .github/workflows/run-hover-integration.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run-declaration-hover-integration
  cancel-in-progress: false

jobs:
  integrate:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/evidence-bounded-declaration-hover
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 22
          package-manager-cache: false

      - name: Execute reviewed integration program
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-hover-integration.yml').read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          if workflow.count(start) != 1 or workflow.count(end) != 1:
              raise SystemExit('integration workflow does not contain one extractable Python program')
          program = workflow.split(start, 1)[1].split(end, 1)[0]
          exec(compile(dedent(program), 'apply-hover-integration.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Verify exact integrated branch
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          node scripts/check-package-contents.mjs
          git diff --check

      - name: Commit integration and remove one-shot workflows
        shell: bash
        run: |
          git config user.name "DiagramWeave Integration"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/apply-hover-integration.yml
          rm .github/workflows/run-hover-integration.yml
          git add -A
          git diff --cached --check
          git commit -m "docs: integrate declaration hover product contracts"
          git push origin HEAD:agent/evidence-bounded-declaration-hover
