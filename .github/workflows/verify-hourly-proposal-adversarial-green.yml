name: Verify hourly proposal adversarial GREEN contract

on:
  push:
    branches:
      - security/isolated-autonomous-publication

concurrency:
  group: verify-hourly-proposal-adversarial-green
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-green:
    runs-on: ubuntu-slim
    timeout-minutes: 25
    steps:
      - name: Check out exact security branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/isolated-autonomous-publication
          fetch-depth: 0

      - name: Apply the reviewed Task 2 hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply-hourly-proposal-task2-hardening.py
          python3 scripts/apply-hourly-proposal-task2-hardening.py

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify foundation and adversarial contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/hourly-proposal-bundle.mjs
          node --test \
            tests/hourly-proposal-bundle.test.js \
            tests/hourly-proposal-bundle-adversarial.test.js
          git diff --check

      - name: Commit verified Task 2 without temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/verify-hourly-proposal-adversarial-red.yml \
            .github/workflows/verify-hourly-proposal-adversarial-green.yml \
            scripts/apply-hourly-proposal-task2-hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(ci): harden proposal artifact boundaries"
          verified_commit_sha="$(git rev-parse HEAD)"
          echo "VERIFIED_COMMIT_SHA=$verified_commit_sha"
          echo "Verified Task 2 commit: $verified_commit_sha" >>"$GITHUB_STEP_SUMMARY"
          git push origin HEAD:security/isolated-autonomous-publication || true
