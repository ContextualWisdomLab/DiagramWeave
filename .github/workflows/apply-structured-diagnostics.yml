name: Apply Structured Diagnostics

on:
  pull_request:
    types:
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: apply-structured-diagnostics-${{ github.repository }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: >-
      github.repository == 'ContextualWisdomLab/DiagramWeave' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/structured-diagnostics'
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - name: Verify immutable repair base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin refs/heads/agent/structured-diagnostics | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate deterministic transformer
        run: node --check scripts/apply-structured-diagnostics.mjs
      - name: Apply reviewed source transformations
        run: node scripts/apply-structured-diagnostics.mjs
      - name: Remove one-shot transformer and workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-structured-diagnostics.mjs
          rm -f .github/workflows/apply-structured-diagnostics.yml
      - name: Install locked workspace
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify repository and package boundaries
        shell: bash
        run: |
          set -euo pipefail
          npm run verify
          npm pack --workspace packages/plantuml-renderer --dry-run --json > "$RUNNER_TEMP/renderer-pack.json"
          npm pack --workspace packages/cli --dry-run --json > "$RUNNER_TEMP/cli-pack.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const allowed = /^(?:LICENSE|README\.md|package\.json|src\/[A-Za-z0-9._-]+\.js)$/u;
          for (const name of ['renderer-pack.json', 'cli-pack.json']) {
            const reports = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/${name}`, 'utf8'));
            if (!Array.isArray(reports) || reports.length !== 1) {
              throw new Error(`${name} must contain exactly one package report.`);
            }
            for (const file of reports[0].files ?? []) {
              if (typeof file.path !== 'string' || !allowed.test(file.path)) {
                throw new Error(`${name} contains unexpected file ${String(file.path)}.`);
              }
            }
          }
          NODE
      - name: Commit and publish verified clean tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/agent/structured-diagnostics | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat: propagate structured PlantUML diagnostics'
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/agent/structured-diagnostics"
