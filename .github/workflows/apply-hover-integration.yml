name: Apply declaration-hover product integration

on:
  push:
    branches:
      - agent/evidence-bounded-declaration-hover
    paths:
      - .github/workflows/apply-hover-integration.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-declaration-hover-integration
  cancel-in-progress: false

jobs:
  integrate:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/evidence-bounded-declaration-hover
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply reviewed product and architecture integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              file_path.write_text(text.replace(old, new), encoding='utf-8')

          def insert_after(path: str, marker: str, addition: str) -> None:
              replace_once(path, marker, marker + addition)

          # PRD implementation status and buyer contract.
          replace_once(
              'docs/product/diagramweave-prd.md',
              '- **문서 버전:** 0.4\n- **작성일:** 2026-08-05',
              '- **문서 버전:** 0.5\n- **작성일:** 2026-08-06',
          )
          folding_status = (
              'LSP 3.18 `textDocument/foldingRange` 구현도 완료됐다. 클라이언트가 plain '
              '`textDocument.foldingRange` capability를 제공한 경우에만 '
              '`foldingRangeProvider: true`를 광고하고, 같은 authoritative symbol tree에서 '
              '완전하고 비어 있지 않은 package·namespace scope만 source-order '
              '`FoldingRange[]`로 반환한다. 유효한 `rangeLimit`과 boolean '
              '`lineFoldingOnly`를 fail-closed로 협상하며, 결과는 최대 1,024개로 '
              '제한되고 renderer·LLM·파일·네트워크를 호출하지 않는다.\n'
          )
          insert_after(
              'docs/product/diagramweave-prd.md',
              folding_status,
              (
                  '\nLSP 3.18 `textDocument/hover`의 evidence-bounded declaration 범위도 구현됐다. '
                  '클라이언트가 plain `textDocument.hover` capability를 제공한 경우에만 '
                  '`hoverProvider: true`를 광고하고, bounded `contentFormat` 선호에서 '
                  '`markdown` 또는 `plaintext`를 순서대로 협상한다. 요청 위치가 같은 '
                  'authoritative symbol tree의 정확한 UTF-16 `selectionRange` 안에 있을 때만 '
                  '고정 선언 종류·표시 이름·입증된 immediate package 또는 namespace container와 '
                  '동일한 frozen range를 반환한다. 그 밖의 유효한 위치는 `null`이며 Markdown은 '
                  'source-derived backtick run보다 긴 fence를 사용한다. renderer·LLM·파일·include·'
                  'macro·workspace·shell·네트워크를 호출하지 않는다.\n'
              ),
          )
          replace_once(
              'docs/product/diagramweave-prd.md',
              'FR-072의 진단·capability-negotiated 문서 심볼·선언 키워드 자동완성·conservative folding range·stdio foundation 범위도 구현됐다. bounded JSON-RPC transport와 transport-neutral session이 같은 UTF-16 진단과 completion 계약을 제공하며, modern client에는 conservative `DocumentSymbol[]` tree를, legacy client에는 같은 tree에서 파생한 `SymbolInformation[]`을 제공한다. legacy `SymbolInformation[]` compatibility 구현은 완료됐고, `textDocument/foldingRange` 구현도 완료됐다. completion resolve, semantic member completion, hover, definition, references, rename, arbitrary region folding과 workspace indexing은 아직 구현되지 않았다.',
              'FR-072의 진단·capability-negotiated 문서 심볼·선언 키워드 자동완성·conservative folding range·evidence-bounded declaration hover·stdio foundation 범위도 구현됐다. bounded JSON-RPC transport와 transport-neutral session이 같은 UTF-16 진단·completion·folding·hover 계약을 제공하며, modern client에는 conservative `DocumentSymbol[]` tree를, legacy client에는 같은 tree에서 파생한 `SymbolInformation[]`을 제공한다. legacy `SymbolInformation[]` compatibility, `textDocument/foldingRange`, explicit declaration-label `textDocument/hover` 구현은 완료됐다. completion resolve, semantic member completion, relation·member hover, definition, references, rename, arbitrary region folding과 workspace indexing은 아직 구현되지 않았다.',
          )
          replace_once(
              'docs/product/diagramweave-prd.md',
              '- **DiagramWeave Language Server:** 편집 진단과 탐색',
              '- **DiagramWeave Language Server:** 편집 진단, outline, completion, folding과 evidence-bounded declaration hover',
          )
          insert_after(
              'docs/product/diagramweave-prd.md',
              '- Node 22·24 CI를 제공한다.\n',
              '- explicit declaration hover가 authoritative UTF-16 label range에서만 동작하고 다른 유효 위치에서는 `null`을 반환한다.\n',
          )

          # Normative architecture composition and trust boundary.
          replace_once(
              'docs/architecture.md',
              'capability-negotiated hierarchical or legacy-flat document symbols, deterministic declaration completion, and conservative folding ranges.',
              'capability-negotiated hierarchical or legacy-flat document symbols, deterministic declaration completion, conservative folding ranges, and evidence-bounded declaration hover.',
          )
          replace_once(
              'docs/architecture.md',
              '9. **Editor intelligence fails by omission.** Document symbols, declaration completion, and folding ranges recognize only explicit high-signal syntax and do not invent semantics from relations, includes, macros, malformed source, or remote content.',
              '9. **Editor intelligence fails by omission.** Document symbols, declaration completion, folding ranges, and declaration hover recognize only explicit high-signal syntax and do not invent semantics from relations, includes, macros, malformed source, or remote content.',
          )
          replace_once(
              'docs/architecture.md',
              '12. **Composed layers retain independent evidence.** Diagnostics, document symbols, compatibility adaptation, completion, and folding own separate state and tests so an outer feature cannot hide regressions in an inner layer.',
              '12. **Composed layers retain independent evidence.** Diagnostics, document symbols, compatibility adaptation, completion, folding, and hover own separate state and tests so an outer feature cannot hide regressions in an inner layer.',
          )
          replace_once(
              'docs/architecture.md',
              'Studio --> LSP : snapshots / diagnostics / outline / completion / folding',
              'Studio --> LSP : snapshots / diagnostics / outline / completion / folding / hover',
          )
          replace_once(
              'docs/architecture.md',
              'Studio will own file tabs, manual source editing, preview layout, diagnostics, outline, completion and folding presentation, Context Inspector, diff review, keyboard interaction, recovery, and user approval.',
              'Studio will own file tabs, manual source editing, preview layout, diagnostics, outline, completion, folding and hover presentation, Context Inspector, diff review, keyboard interaction, recovery, and user approval.',
          )
          insert_after(
              'docs/architecture.md',
              '- advertise and serve conservative `textDocument/foldingRange` only to clients that declare a valid folding capability;\n',
              '- advertise and serve evidence-bounded `textDocument/hover` only to clients that declare a valid hover capability;\n',
          )
          replace_once(
              'docs/architecture.md',
              'diagnostic session\n  -> document-symbol session\n    -> declaration-completion session\n      -> folding-range session',
              'diagnostic session\n  -> document-symbol session\n    -> declaration-completion session\n      -> folding-range session\n        -> declaration-hover session',
          )
          replace_once(
              'docs/architecture.md',
              'Direct unit tests cover every layer independently, even though the public entry point exposes the outer folding session.',
              'Direct unit tests cover every layer independently, even though the public entry point exposes the outer hover session.',
          )
          folding_architecture = (
              '`createFoldingLanguageServerSession` wraps the completion session and stores only successful accepted source snapshots. '
              '`foldingRangesForSource` walks the same authoritative symbol tree iteratively, emitting immutable zero-based line ranges only for complete nonempty package and namespace scopes. '
              'Initialize-time `rangeLimit` and `lineFoldingOnly` values are validated under hostile boundaries; unsupported or malformed capabilities do not advertise `foldingRangeProvider`. '
              'Folding performs no renderer, LLM, filesystem, include, macro, workspace, or network work.\n'
          )
          insert_after(
              'docs/architecture.md',
              folding_architecture,
              (
                  '\n`createHoverLanguageServerSession` wraps the folding session and mirrors only '
                  'successful accepted full-document snapshots. `declarationHoverForSource` walks '
                  'the same authoritative symbol tree iteratively and matches only an exact UTF-16 '
                  'declaration `selectionRange`. It returns immutable MarkupContent with fixed '
                  'declaration detail, displayed name, immediate proven grouping container, and the '
                  'same frozen range; nonmatching valid positions return `null`. Initialize-time '
                  '`contentFormat` negotiation is bounded and fail-closed. Markdown uses a dynamic '
                  'fence longer than source-derived backtick runs. Hover performs no renderer, LLM, '
                  'filesystem, include, macro, workspace, shell, or network work.\n'
              ),
          )
          replace_once(
              'docs/architecture.md',
              '- implementing completion resolve, snippets, semantic member completion, hover, definition, references, rename, or arbitrary region folding;',
              '- implementing completion resolve, snippets, semantic member completion, relation or member hover, definition, references, rename, or arbitrary region folding;',
          )
          replace_once(
              'docs/architecture.md',
              '- map invalid completion positions to `-32602` Invalid params;',
              '- map invalid completion and hover positions to `-32602` Invalid params;',
          )
          replace_once(
              'docs/architecture.md',
              '- duplicating diagnostics, document symbols, completion, folding, or source snapshots;',
              '- duplicating diagnostics, document symbols, completion, folding, hover, or source snapshots;',
          )
          folding_flow = (
              '### Folding ranges\n\n'
              '1. During initialize, the folding layer accepts only a plain `textDocument.foldingRange` capability with valid optional `rangeLimit` and `lineFoldingOnly` values.\n'
              '2. A supported client receives `foldingRangeProvider: true`; every unsupported or hostile capability state fails closed without advertising it.\n'
              '3. Successful open and full-document change notifications are copied into the folding snapshot only after all inner layers accept them.\n'
              '4. A `textDocument/foldingRange` request validates the local open-document URI and reads the latest accepted source.\n'
              '5. `foldingRangesForSource` obtains the same authoritative document-symbol tree and walks it iteratively in source preorder.\n'
              '6. Only proven nonempty package or namespace scopes emit immutable `{ startLine, endLine }` records, bounded by the client preference and 1,024-symbol ceiling.\n'
              '7. The stdio adapter serializes the same transport-neutral result; the host owns display, collapse state, and keyboard interaction.\n'
          )
          insert_after(
              'docs/architecture.md',
              folding_flow,
              (
                  '\n### Declaration hover\n\n'
                  '1. During initialize, the hover layer accepts only a plain `textDocument.hover` capability and a bounded ordered `contentFormat` preference.\n'
                  '2. A supported client receives `hoverProvider: true`; every unsupported or hostile capability state fails closed without advertising it.\n'
                  '3. Successful open and full-document change notifications are copied into the hover snapshot only after all inner layers accept them.\n'
                  '4. A `textDocument/hover` request validates the local URI and copies the caller-owned UTF-16 position under a hostile boundary.\n'
                  '5. `declarationHoverForSource` validates the position against the latest accepted source and walks the authoritative symbol tree iteratively.\n'
                  '6. Only a position inside one exact declaration-label `selectionRange` emits immutable MarkupContent, immediate proven container context, and the authoritative range; every other valid position returns `null`.\n'
                  '7. Markdown fences are longer than every dynamic backtick run, and the stdio adapter serializes the same transport-neutral result.\n'
              ),
          )
          replace_once(
              'docs/architecture.md',
              'Language Server errors include stable lifecycle, URI, source, document, version, completion-position, and method codes. Completion-specific malformed positions use `document_position_invalid`; the stdio layer maps this and other parameter families to fixed JSON-RPC Invalid params responses.',
              'Language Server errors include stable lifecycle, URI, source, document, version, completion/hover-position, and method codes. Completion and hover malformed positions use `document_position_invalid`; the stdio layer maps this and other parameter families to fixed JSON-RPC Invalid params responses.',
          )
          replace_once(
              'docs/architecture.md',
              '- Diagnostics, capability-negotiated hierarchical or legacy-flat document symbols, completion, and folding ranges remain transport-neutral contracts reusable by CLI, Studio, IDEs, naruon, and service wrappers.',
              '- Diagnostics, capability-negotiated hierarchical or legacy-flat document symbols, completion, folding ranges, and evidence-bounded declaration hover remain transport-neutral contracts reusable by CLI, Studio, IDEs, naruon, and service wrappers.',
          )
          replace_once(
              'docs/architecture.md',
              '- Public error codes, diagnostic fields, proposal schema version, Language Server capabilities, negotiated `DocumentSymbol[]` and `SymbolInformation[]` shapes, completion item shape, folding range shape, and package exports are compatibility contracts.\n- A breaking proposal, diagnostic, symbol-tree, symbol-information, completion, or folding schema requires an explicit version and migration guidance.',
              '- Public error codes, diagnostic fields, proposal schema version, Language Server capabilities, negotiated `DocumentSymbol[]` and `SymbolInformation[]` shapes, completion item shape, folding range shape, hover MarkupContent/range shape, and package exports are compatibility contracts.\n- A breaking proposal, diagnostic, symbol-tree, symbol-information, completion, folding, or hover schema requires an explicit version and migration guidance.',
          )
          insert_after(
              'docs/architecture.md',
              '- Compatible folding behavior must remain sourced from the authoritative symbol tree, deterministic, bounded, and covered by capability and lifecycle tests.\n',
              '- Compatible hover behavior must remain limited to exact authoritative declaration selections, deterministic, bounded, and covered by capability, security, lifecycle, and stdio tests.\n',
          )

          # Root ADR index.
          replace_once(
              'ARCHITECTURE.md',
              '| `@contextualwisdomlab/diagramweave-language-server` | Transport-neutral LSP lifecycle, diagnostics, capability-negotiated hierarchical or legacy-flat document symbols, deterministic declaration completion, and conservative folding ranges |',
              '| `@contextualwisdomlab/diagramweave-language-server` | Transport-neutral LSP lifecycle, diagnostics, capability-negotiated hierarchical or legacy-flat document symbols, deterministic declaration completion, conservative folding ranges, and evidence-bounded declaration hover |',
          )
          replace_once(
              'ARCHITECTURE.md',
              '10. Conservative folding ranges reuse the authoritative document-symbol tree,\n    expose only proven nonempty package and namespace scopes, and walk source\n    preorder without recursive product traversal or a second parser.\n11. Diagnostics, outlines, compatibility adaptation, completion, and folding are\n    composed layers with independent tests and source ownership; a rejected or\n    late mutation cannot restore stale state in an outer layer.\n12. LSP positions use UTF-16 code units; multilingual and emoji ranges are\n    regression-tested across LF, CRLF, and CR source.\n13. Organization-central `.github` workflows own merge governance. Scheduled\n    product development uses OpenCode with `NVIDIA_NIM_API_KEY`, not Copilot.\n14. No release occurs while packages remain `0.0.0` under `Unreleased` or while\n    Studio, cross-platform runtime evidence, signing, SBOM/provenance, and\n    rollback evidence remain incomplete.',
              '10. Conservative folding ranges reuse the authoritative document-symbol tree,\n    expose only proven nonempty package and namespace scopes, and walk source\n    preorder without recursive product traversal or a second parser.\n11. Evidence-bounded declaration hover reuses the same authoritative tree,\n    matches only exact UTF-16 label selections, returns `null` elsewhere, and\n    fences source-derived Markdown with a non-terminable delimiter.\n12. Diagnostics, outlines, compatibility adaptation, completion, folding, and\n    hover are composed layers with independent tests and source ownership; a\n    rejected or late mutation cannot restore stale state in an outer layer.\n13. LSP positions use UTF-16 code units; multilingual and emoji ranges are\n    regression-tested across LF, CRLF, and CR source.\n14. Organization-central `.github` workflows own merge governance. Scheduled\n    product development uses OpenCode with `NVIDIA_NIM_API_KEY`, not Copilot.\n15. No release occurs while packages remain `0.0.0` under `Unreleased` or while\n    Studio, cross-platform runtime evidence, signing, SBOM/provenance, and\n    rollback evidence remain incomplete.',
          )
          insert_after(
              'ARCHITECTURE.md',
              '- [`docs/product/folding-ranges.md`](docs/product/folding-ranges.md)\n',
              '- [`docs/product/declaration-hover.md`](docs/product/declaration-hover.md)\n',
          )
          insert_after(
              'ARCHITECTURE.md',
              '- [`docs/research/plantuml-folding-ranges.md`](docs/research/plantuml-folding-ranges.md)\n',
              '- [`docs/research/plantuml-declaration-hover.md`](docs/research/plantuml-declaration-hover.md)\n',
          )
          insert_after(
              'ARCHITECTURE.md',
              '- [`docs/operations/folding-ranges.md`](docs/operations/folding-ranges.md)\n',
              '- [`docs/operations/declaration-hover.md`](docs/operations/declaration-hover.md)\n',
          )
          insert_after(
              'ARCHITECTURE.md',
              '- [`docs/superpowers/plans/2026-08-05-conservative-folding-ranges.md`](docs/superpowers/plans/2026-08-05-conservative-folding-ranges.md)',
              '\n- [`docs/superpowers/specs/2026-08-06-evidence-bounded-declaration-hover-design.md`](docs/superpowers/specs/2026-08-06-evidence-bounded-declaration-hover-design.md)\n- [`docs/superpowers/plans/2026-08-06-evidence-bounded-declaration-hover.md`](docs/superpowers/plans/2026-08-06-evidence-bounded-declaration-hover.md)',
          )
          PY

      - name: Verify exact integrated branch
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          node scripts/check-package-contents.mjs
          git diff --check

      - name: Commit integration and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "DiagramWeave Integration"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/apply-hover-integration.yml
          git add -A
          git diff --cached --check
          git commit -m "docs: integrate declaration hover product contracts"
          git push origin HEAD:agent/evidence-bounded-declaration-hover
