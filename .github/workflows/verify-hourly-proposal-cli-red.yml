name: Verify hourly proposal CLI RED contract

on:
  push:
    branches:
      - security/isolated-autonomous-publication

concurrency:
  group: verify-hourly-proposal-cli-red
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-red:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out exact security branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/isolated-autonomous-publication
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 24
          package-manager-cache: false

      - name: Confirm CLI contract is RED because no command dispatcher exists
        shell: bash
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/hourly-proposal-cli-red.log"
          set +e
          node --test tests/hourly-proposal-bundle-cli.test.js \
            >"$output_file" 2>&1
          test_status=$?
          set -e
          cat "$output_file"

          if [ "$test_status" -eq 0 ]; then
            echo "::error::The proposal CLI contract unexpectedly passed before implementation."
            exit 1
          fi
          grep -F 'build failed' "$output_file"
          grep -F 'verify-receipt failed' "$output_file"
          grep -F 'fail 4' "$output_file"
          echo "CLI integration contracts failed because the trusted module has no command dispatcher yet." \
            >>"$GITHUB_STEP_SUMMARY"
