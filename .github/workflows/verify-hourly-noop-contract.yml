name: Verify hourly no-op fallback contract

on:
  push:
    branches:
      - fix/hourly-product-noop-fallback

concurrency:
  group: verify-hourly-noop-fallback-contract
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-slim
    timeout-minutes: 25
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/hourly-product-noop-fallback
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the locked workspace
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify focused control-flow contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/hourly-noop-fallback-contract.test.js

      - name: Prove the contracts reject three control-flow regressions
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/hourly-product-development.yml
          cp "$workflow" "$RUNNER_TEMP/hourly-product-development.yml"

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/hourly-product-development.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          if [ "$status" -ne 0 ]; then
            if [ "$EXECUTION_MODE" = "remediation" ]; then
'''
          new = '''          if [ "$status" -ne 0 ]; then
            if [ "$EXECUTION_MODE" = "remediation" ] && \\
               [ "$completed_without_mutation" -gt 0 ]; then
'''
          if text.count(old) != 1:
              raise SystemExit('could not inject remediation counter regression')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          if node --test tests/hourly-noop-fallback-contract.test.js; then
            echo "::error::The contract accepted a counter-gated remediation regression."
            exit 1
          fi
          cp "$RUNNER_TEMP/hourly-product-development.yml" "$workflow"

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/hourly-product-development.yml')
          text = path.read_text(encoding='utf-8')
          old = '            git clean -fd\n'
          if text.count(old) != 1:
              raise SystemExit('could not inject candidate-cleanup regression')
          path.write_text(
              text.replace(old, '            : # intentionally removed git clean\n', 1),
              encoding='utf-8',
          )
          PY
          if node --test tests/hourly-noop-fallback-contract.test.js; then
            echo "::error::The contract accepted a missing candidate-cleanup regression."
            exit 1
          fi
          cp "$RUNNER_TEMP/hourly-product-development.yml" "$workflow"

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/hourly-product-development.yml')
          text = path.read_text(encoding='utf-8')
          old = '''            if [ "$EXECUTION_MODE" = "product" ]; then
              echo "::error::Product-development mode completed without a repository mutation."
              echo "A clean model exit is not a completed product increment." \\
                >>"$GITHUB_STEP_SUMMARY"
              exit 1
            fi
'''
          new = old.replace('              exit 1\n', '              exit 0\n')
          if text.count(old) != 1:
              raise SystemExit('could not inject product false-green regression')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          if node --test tests/hourly-noop-fallback-contract.test.js; then
            echo "::error::The contract accepted a false-green product regression."
            exit 1
          fi
          cp "$RUNNER_TEMP/hourly-product-development.yml" "$workflow"
          cmp "$workflow" "$RUNNER_TEMP/hourly-product-development.yml"

      - name: Verify the complete repository
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm run verify
          node scripts/check-package-contents.mjs

      - name: Commit the verified test hardening without retaining this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/verify-hourly-noop-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(ci): execute no-op fallback control flow"
          verified_commit_sha="$(git rev-parse HEAD)"
          echo "VERIFIED_COMMIT_SHA=$verified_commit_sha"
          echo "Verified commit: $verified_commit_sha" >>"$GITHUB_STEP_SUMMARY"
          git push origin HEAD:fix/hourly-product-noop-fallback || true
