name: Execute folding documentation repair

on:
  push:
    branches:
      - agent/conservative-folding-ranges
    paths:
      - .github/workflows/run-repair-folding-docs.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/run-repair-folding-docs.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: execute-folding-docs-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/conservative-folding-ranges
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 22
          package-manager-cache: false

      - name: Execute the reviewed repair program
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/repair-folding-docs.yml').read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          if workflow.count(start) != 1 or workflow.count(end) != 1:
              raise SystemExit('repair workflow does not contain one extractable Python program')
          program = workflow.split(start, 1)[1].split(end, 1)[0]
          exec(compile(dedent(program), 'repair-folding-docs.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Install and verify exact repository
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          node scripts/check-package-contents.mjs

      - name: Commit verified documentation and remove one-shot automation
        shell: bash
        run: |
          git config user.name "DiagramWeave Documentation Repair"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/repair-folding-docs.yml
          rm .github/workflows/run-repair-folding-docs.yml
          git add -A
          git diff --cached --check
          git commit -m "docs: complete folding-range product contracts"
          git push origin HEAD:agent/conservative-folding-ranges
