name: Finalize Document Symbol Compatibility

on:
  push:
    branches:
      - agent/legacy-document-symbol-fallback
    paths:
      - .github/workflows/finalize-document-symbol-compatibility.yml

permissions:
  contents: read

concurrency:
  group: diagramweave-document-symbol-compatibility-finalize
  cancel-in-progress: true

jobs:
  patch-verify-and-clean:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/legacy-document-symbol-fallback
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact compatibility documentation patches
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_value: str, old: str, new: str) -> None:
              path = Path(path_value)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path_value}: expected one exact replacement target, found {count}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")

          prd = "docs/product/diagramweave-prd.md"
          replace_once(prd, "- **문서 버전:** 0.2\n- **작성일:** 2026-08-04", "- **문서 버전:** 0.3\n- **작성일:** 2026-08-05")
          replace_once(
              prd,
              "FR-011의 계층형 문서 심볼·개요와 선언 키워드 자동완성 foundation 범위는 구현됐다. LSP 3.18 `textDocument/documentSymbol`은 명시적 PlantUML 선언을 source-order immutable UTF-16 tree로 반환하고, 완전한 unquoted brace scope와 동일 indentation의 standalone close가 입증된 경우에만 `children`과 enclosing parent range를 제공한다. capability-gated `textDocument/completion`은 안전한 줄 선두 접두사에 결정론적 UTF-16 `textEdit`를 제공한다. Studio·IDE·`dweave-lsp`·naruon에서 동일한 세션을 재사용하며 implicit participant, 관계 endpoint, member, macro, include, renderer-dependent syntax, malformed 선언, 불완전 hierarchy와 모호한 자동완성 문맥은 추측하지 않는다.",
              "FR-011의 capability-negotiated 문서 심볼·개요와 선언 키워드 자동완성 foundation 범위는 구현됐다. LSP 3.18 `textDocument/documentSymbol`은 `hierarchicalDocumentSymbolSupport: true`를 명시한 클라이언트에는 명시적 PlantUML 선언의 source-order immutable UTF-16 `DocumentSymbol[]` tree를 반환하고, 그 밖의 클라이언트에는 같은 authoritative tree를 반복 순회해 만든 immutable `SymbolInformation[]`을 반환한다. flat child는 입증된 immediate parent의 `containerName`과 validated local URI·enclosing range를 보존한다. 완전한 unquoted package 또는 namespace brace scope와 동일 indentation의 standalone close가 입증된 경우에만 hierarchy의 `children`과 enclosing parent range를 제공한다. capability-gated `textDocument/completion`은 안전한 줄 선두 접두사에 결정론적 UTF-16 `textEdit`를 제공한다. Studio·IDE·`dweave-lsp`·naruon에서 동일한 세션을 재사용하며 implicit participant, 관계 endpoint, member, macro, include, renderer-dependent syntax, malformed 선언, 불완전 hierarchy와 모호한 자동완성 문맥은 추측하지 않는다."
          )
          replace_once(
              prd,
              "FR-072의 진단·계층형 문서 심볼·선언 키워드 자동완성·stdio foundation 범위도 구현됐다. bounded JSON-RPC transport와 transport-neutral session이 같은 UTF-16 진단, conservative document-symbol tree 및 capability-gated completion 계약을 제공한다. legacy flat-only symbol fallback, completion resolve, semantic member completion, hover, definition, references, rename과 workspace indexing은 아직 구현되지 않았다.",
              "FR-072의 진단·capability-negotiated 문서 심볼·선언 키워드 자동완성·stdio foundation 범위도 구현됐다. bounded JSON-RPC transport와 transport-neutral session이 같은 UTF-16 진단과 completion 계약을 제공하며, modern client에는 conservative `DocumentSymbol[]` tree를, legacy client에는 같은 tree에서 파생한 `SymbolInformation[]`을 제공한다. legacy `SymbolInformation[]` compatibility 구현은 완료됐고, completion resolve, semantic member completion, hover, definition, references, rename과 workspace indexing은 아직 구현되지 않았다."
          )

          architecture = "docs/architecture.md"
          replace_once(
              architecture,
              "The implemented foundation contains a portable trust kernel, a Contextual Orchestrator adapter, an isolated local PlantUML renderer, safe structured diagnostics, a deterministic CLI, a transport-neutral Language Server, bounded JSON-RPC stdio integration, conservative hierarchical document symbols, and deterministic declaration completion.",
              "The implemented foundation contains a portable trust kernel, a Contextual Orchestrator adapter, an isolated local PlantUML renderer, safe structured diagnostics, a deterministic CLI, a transport-neutral Language Server, bounded JSON-RPC stdio integration, capability-negotiated hierarchical or legacy-flat document symbols, and deterministic declaration completion."
          )
          replace_once(
              architecture,
              "10. **Hierarchy requires complete structural evidence.** Only stack-ordered declaration braces with identical opening and closing indentation create children; ambiguous or incomplete source remains flat.\n11. **Composed layers retain independent evidence.** Diagnostics, document symbols, and completion own separate state and tests so an outer feature cannot hide regressions in an inner layer.",
              "10. **Hierarchy requires complete structural evidence.** Only stack-ordered package or namespace declaration braces with identical opening and closing indentation create children; ambiguous or incomplete source remains flat.\n11. **Protocol compatibility is presentation, not parsing.** `symbolInformationForDocument` iteratively derives immutable `SymbolInformation[]` from the same authoritative tree when a client does not advertise hierarchical support.\n12. **Composed layers retain independent evidence.** Diagnostics, document symbols, compatibility adaptation, and completion own separate state and tests so an outer feature cannot hide regressions in an inner layer."
          )
          replace_once(
              architecture,
              "- provide conservative source-order `textDocument/documentSymbol` trees with optional proven children and enclosing parent ranges;",
              "- provide conservative source-order `textDocument/documentSymbol` results, returning `DocumentSymbol[]` only to clients that explicitly advertise `hierarchicalDocumentSymbolSupport: true` and otherwise returning legacy-compatible `SymbolInformation[]`;"
          )
          replace_once(
              architecture,
              "Document-symbol hierarchy is computed locally after explicit declaration parsing. One unmatched unquoted declaration brace may become a parent only when it is closed in stack order by a standalone brace with identical indentation. Quoted, commented, balanced one-line, unmatched, multi-open, cross-indented, and crossed structure remains flat. Parent ranges extend through proven close lines, roots and siblings preserve source order, and the frozen tree is constructed bottom-up without recursive product traversal.\n\nDeclaration completion uses a fixed catalog",
              "Document-symbol hierarchy is computed locally after explicit declaration parsing. One unmatched unquoted package or namespace declaration brace may become a parent only when it is closed in stack order by a standalone brace with identical indentation. Quoted, commented, balanced one-line, unmatched, multi-open, cross-indented, and crossed structure remains flat. Parent ranges extend through proven close lines, roots and siblings preserve source order, and the frozen tree is constructed bottom-up without recursive product traversal.\n\nInitialize-time capability negotiation changes only presentation. Exact boolean `hierarchicalDocumentSymbolSupport: true` returns the authoritative `DocumentSymbol[]` tree. Every other and hostile capability state invokes `symbolInformationForDocument`, which walks the same authoritative tree iteratively and returns deeply frozen source-preorder `SymbolInformation[]` with the validated local URI, enclosing range, and immediate proven `containerName`. No second PlantUML scanner is introduced.\n\nDeclaration completion uses a fixed catalog"
          )
          replace_once(
              architecture,
              "4. A document-symbol request scans explicit declarations and masks comments without shifting UTF-16 offsets.\n5. A bounded structural pass matches only complete stack-ordered declaration braces with identical opening and closing indentation.\n6. Matched intervals receive source-order children and enclosing ranges; ambiguous and incomplete structure remains flat.\n7. The layer freezes children bottom-up and returns bounded source-order roots or a stable source-free error.\n8. Later accepted changes replace the snapshot; close and lifecycle invalidation remove it.",
              "4. During initialize, the document-symbol layer probes `hierarchicalDocumentSymbolSupport` without trusting hostile getters or proxies.\n5. A document-symbol request scans explicit declarations and masks comments without shifting UTF-16 offsets.\n6. A bounded structural pass matches only complete stack-ordered package or namespace declaration braces with identical opening and closing indentation.\n7. Matched intervals receive source-order children and enclosing ranges; ambiguous and incomplete structure remains flat.\n8. The layer freezes children bottom-up into one authoritative bounded tree.\n9. Hierarchical clients receive that tree; all other clients receive `symbolInformationForDocument` output from the same tree, URI, and proven immediate-parent relationships.\n10. Later accepted changes replace the snapshot; close and lifecycle invalidation remove it."
          )
          replace_once(
              architecture,
              "- Diagnostics, hierarchical document symbols, and completion remain transport-neutral contracts reusable by CLI, Studio, IDEs, naruon, and service wrappers.",
              "- Diagnostics, capability-negotiated hierarchical or legacy-flat document symbols, and completion remain transport-neutral contracts reusable by CLI, Studio, IDEs, naruon, and service wrappers."
          )
          replace_once(
              architecture,
              "- Public error codes, diagnostic fields, proposal schema version, Language Server capabilities, document-symbol hierarchy, completion item shape, and package exports are compatibility contracts.\n- A breaking proposal, diagnostic, symbol-tree, or completion schema requires an explicit version and migration guidance.",
              "- Public error codes, diagnostic fields, proposal schema version, Language Server capabilities, negotiated `DocumentSymbol[]` and `SymbolInformation[]` shapes, completion item shape, and package exports are compatibility contracts.\n- A breaking proposal, diagnostic, symbol-tree, symbol-information, or completion schema requires an explicit version and migration guidance."
          )

          changelog = "CHANGELOG.md"
          path = Path(changelog)
          text = path.read_text(encoding="utf-8")
          marker = "### Added\n\n"
          if text.count(marker) != 1:
              raise SystemExit(f"{changelog}: expected one Added marker")
          entry = (
              "- Capability-negotiated LSP 3.18 document symbols that preserve the "
              "authoritative hierarchical `DocumentSymbol[]` tree for clients explicitly "
              "advertising `hierarchicalDocumentSymbolSupport: true` and derive deeply "
              "frozen source-order `SymbolInformation[]` with validated local locations "
              "and immediate `containerName` values for legacy clients, without a second "
              "parser, recursive traversal, renderer, LLM, file read, or network request.\n"
          )
          path.write_text(text.replace(marker, marker + entry, 1), encoding="utf-8")

          contract = Path("tests/document-symbol-compatibility-repository-contract.test.js")
          text = contract.read_text(encoding="utf-8")
          unwanted = "  assert.doesNotMatch(adapterSource, /function\\s+\\w+\\([^)]*\\)\\s*\\{[^}]*\\b\\1\\s*\\(/s);\n"
          if text.count(unwanted) != 1:
              raise SystemExit("repository contract: expected one invalid recursion assertion")
          contract.write_text(text.replace(unwanted, ""), encoding="utf-8")

      - name: Set up Node.js 24
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked workspace
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify repository
        run: npm run verify

      - name: Verify package contents
        run: node scripts/check-package-contents.mjs

      - name: Remove one-shot workflow and push verified tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-document-symbol-compatibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            docs/architecture.md \
            docs/product/diagramweave-prd.md \
            tests/document-symbol-compatibility-repository-contract.test.js \
            .github/workflows/finalize-document-symbol-compatibility.yml
          git diff --cached --check
          git commit -m "docs: finalize document-symbol compatibility"
          git push origin HEAD:agent/legacy-document-symbol-fallback
