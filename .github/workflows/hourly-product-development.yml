name: Hourly Product Development

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-product-development-${{ github.repository }}
  cancel-in-progress: false

# ContextualWisdomLab/contextual-orchestrator has no immutable release that
# DiagramWeave can consume. Keep this named entry point visible but inert until
# the owner completes ContextualWisdomLab/contextual-orchestrator#1023.
jobs:
  unreleased-gateway-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse unreleased owner integration
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "::error::DiagramWeave consumer integration remains disabled."
            echo "ContextualWisdomLab/contextual-orchestrator#1023 must publish an immutable release before consumption."
            echo "ContextualWisdomLab/DiagramWeave#35 tracks the orchestrator/free consumer contract."
            echo "ContextualWisdomLab/DiagramWeave#28 tracks separation of proposal verification and publication authority."
            echo "The future integration must use the released gateway contract and gateway token only."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
