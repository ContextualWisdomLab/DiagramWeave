name: Hourly Product Development

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Evaluate the gate and prompt without running the agent
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "47 * * * *"

concurrency:
  group: hourly-product-development-${{ github.repository }}
  cancel-in-progress: false

# The default token is read-only; only the single job that pushes the agent's
# branch and opens the pull request elevates to write. The coding agent itself
# runs inside that job as an OpenCode session against NVIDIA NIM,
# authenticated only by the NVIDIA_NIM_API_KEY organization secret. No Copilot
# subscription, Agent Tasks API, or fine-grained user token is involved.
permissions:
  contents: read

jobs:
  dispatch-product-gap:
    if: github.repository == 'ContextualWisdomLab/DiagramWeave'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
      pull-requests: write
    env:
      DEFAULT_BRANCH: main
      DRY_RUN: ${{ inputs.dry_run || false }}
      REPOSITORY_TOKEN: ${{ github.token }}
      OPENCODE_VERSION: "1.17.13"
      OPENCODE_SHA256: 157afa289d1a8d9372de0ce19ac726119b937a1f6b201808d46f06e4e59bb348
      OPENCODE_MODEL_CANDIDATES: >-
        nvidia-nim/nvidia/llama-3.3-nemotron-super-49b-v1.5
        nvidia-nim/nvidia/nemotron-3-super-120b-a12b
        nvidia-nim/deepseek-ai/deepseek-v4-pro
      OPENCODE_RUN_TIMEOUT_SECONDS: "2400"
    steps:
      - name: Enforce pull-request-first single-flight gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          if ! open_prs="$(
            GH_TOKEN="$REPOSITORY_TOKEN" gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 1 \
              --json number,url
          )"; then
            {
              echo "dispatch=false"
              echo "reason=pull_request_inventory_unavailable"
            } >>"$GITHUB_OUTPUT"
            echo "::error::Pull-request inventory was unavailable; no safe decision can be made."
            echo "Inventory failure is a workflow failure, not a successful skip." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$(jq 'length' <<<"$open_prs")" -gt 0 ]; then
            {
              echo "dispatch=false"
              echo "reason=open_pull_request"
            } >>"$GITHUB_OUTPUT"
            echo "An open pull request exists; PR governance owns this hour." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            {
              echo "dispatch=false"
              echo "reason=dry_run"
            } >>"$GITHUB_OUTPUT"
            echo "Dry run selected after successful pull-request inventory." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "dispatch=true"
            echo "reason=ready"
          } >>"$GITHUB_OUTPUT"

      - name: Prepare bounded commercial-quality task
        if: steps.gate.outputs.dispatch == 'true' || steps.gate.outputs.reason == 'dry_run'
        shell: bash
        run: |
          cat >"$RUNNER_TEMP/diagramweave-agent-prompt.md" <<'PROMPT'
          Continue product development for ContextualWisdomLab/DiagramWeave.

          Start by reading AGENTS.md, README.md, CHANGELOG.md,
          docs/product/diagramweave-prd.md, docs/architecture.md,
          docs/security-model.md, docs/operations, open issues, recent merged pull
          requests, current source, tests, package contracts, and active release evidence.
          Identify the single highest-value buyer-visible product, reliability,
          interoperability, security, evaluation, accessibility, or operations gap that
          can be completed as exactly one bounded pull request. Do not create another repository.

          Keep DiagramWeave source-first. Manual editing, validation, and safe local workflows
          must remain usable without an account, internet connection, or LLM. PlantUML is the
          first language, but new boundaries must preserve diagram-language adapters. AI output
          is untrusted and must remain a revision-bound proposal that users inspect, validate,
          accept, or reject; never silently apply, save, commit, or transmit source.

          Use or improve ContextualWisdomLab/contextual-orchestrator for every product LLM path
          instead of adding an unrelated direct-provider client. Keep the Contextual Orchestrator
          integration provider-neutral, bounded, auditable, secret-redacted, and independently
          replaceable. Preserve the standalone packages and their modular MSA role, including
          compatibility with ContextualWisdomLab/.github, naruon, and other CWL services.

          Work test-first: establish a failing regression or executable contract before
          implementation, then make the smallest coherent change that passes it. Maintain
          100% production statement and branch coverage and
          100% production function and docstring coverage. Docstrings must let a beginner
          understand public modules,
          classes, functions, methods, properties, inputs, outputs, exceptions, and security
          boundaries without reverse-engineering implementation. New database objects, if
          unavoidable, must use descriptive two-word-or-longer snake_case names.

          Run focused tests, the complete suite, coverage and docstring gates, syntax and type
          checks, package build and installed-package smoke tests when packages are publishable,
          plus relevant SAST, dependency, secret, workflow, renderer-sandbox, and adversarial
          checks. Do not add skipped or ignored release-gate tests.

          Where behavior is ambiguous, use current authoritative international standards,
          primary technical documentation, and peer-reviewed research. Cite papers in APA 7
          style and distinguish standards, source-supported claims, measurements, assumptions,
          and inference. Use Figma or Product Design when a real Studio screen, workflow,
          interaction contract, accessibility state, or visual comparison benefits from it;
          do not manufacture design work for a backend-only increment.

          Update CHANGELOG.md and all affected product, architecture, operations, security,
          accessibility, evaluation, and user documentation. Follow Semantic Versioning. Change
          the package version only when the integrated state is genuinely release-ready, and
          prepare release notes in the pull request rather than publishing a release from the task.

          Do not merge, publish, release, or bypass branch protection. Do not weaken security,
          coverage, docstring, independent-review, or exact-head verification gates. Do not make
          unrelated refactors. Leave the working tree holding one bounded increment and write
          PR_MESSAGE.md at the repository root: the title on the first line, then a body with
          reproducible verification evidence, citations where relevant, and explicit residual
          risks. This workflow packages your working tree as exactly one bounded pull request
          against main. The review → repair → exact-head Checks → merge loop owns subsequent
          mutations and the final merge decision.
          PROMPT

      - name: Record dry-run decision
        if: steps.gate.outputs.reason == 'dry_run'
        shell: bash
        run: |
          {
            echo "Dry run: one bounded product-development agent session would start."
            echo
            cat "$RUNNER_TEMP/diagramweave-agent-prompt.md"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Require the NVIDIA NIM model credential
        if: steps.gate.outputs.dispatch == 'true'
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "::error::NVIDIA_NIM_API_KEY is required only for the selected model-backed path."
            echo "reason=nim_api_key_unavailable" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::add-mask::$NVIDIA_API_KEY"

      - name: Check out the default branch without persisted credentials
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Install the pinned OpenCode CLI
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/opencode-linux-x64.tar.gz"
          install_dir="${HOME}/.opencode/bin"
          mkdir -p "$install_dir"
          curl -fsSL \
            -o "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          printf '%s  %s\n' "$OPENCODE_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "${RUNNER_TEMP}/opencode" "${install_dir}/opencode"
          "${install_dir}/opencode" --version
          echo "$install_dir" >>"$GITHUB_PATH"

      - name: Configure OpenCode for NVIDIA NIM
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat >"$GITHUB_WORKSPACE/opencode.json" <<'CONFIG'
          {
            "$schema": "https://opencode.ai/config.json",
            "enabled_providers": ["nvidia-nim"],
            "model": "nvidia-nim/nvidia/llama-3.3-nemotron-super-49b-v1.5",
            "small_model": "nvidia-nim/meta/llama-3.3-70b-instruct",
            "provider": {
              "nvidia-nim": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "https://integrate.api.nvidia.com/v1",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "nvidia/llama-3.3-nemotron-super-49b-v1.5": {
                    "name": "NVIDIA Llama 3.3 Nemotron Super 49B v1.5",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  },
                  "nvidia/nemotron-3-super-120b-a12b": {
                    "name": "NVIDIA Nemotron 3 Super 120B",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  },
                  "deepseek-ai/deepseek-v4-pro": {
                    "name": "DeepSeek V4 Pro (NIM)",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  },
                  "meta/llama-3.3-70b-instruct": {
                    "name": "Meta Llama 3.3 70B Instruct (NIM)",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  }
                }
              }
            }
          }
          CONFIG
          echo "/opencode.json" >>"$GITHUB_WORKSPACE/.git/info/exclude"

      - name: Run the NVIDIA NIM development agent
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: |
          set -euo pipefail

          prompt="$(cat "$RUNNER_TEMP/diagramweave-agent-prompt.md")"
          status=1
          for model in $OPENCODE_MODEL_CANDIDATES; do
            echo "::group::opencode $model"
            if timeout --kill-after=30s "${OPENCODE_RUN_TIMEOUT_SECONDS}s" \
              env -u GH_TOKEN -u GITHUB_TOKEN -u REPOSITORY_TOKEN \
              -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
              opencode run "$prompt" --model "$model"; then
              status=0
              echo "::endgroup::"
              echo "Agent session completed with \`$model\`." >>"$GITHUB_STEP_SUMMARY"
              break
            fi
            echo "::endgroup::"
            echo "::warning::Model $model failed; discarding partial work and trying the next candidate."
            git -C "$GITHUB_WORKSPACE" reset --hard HEAD
            git -C "$GITHUB_WORKSPACE" clean -fd
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::Every NVIDIA NIM model candidate failed; no work was proposed."
            exit 1
          fi

      - name: Open exactly one bounded pull request
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          rm -f opencode.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "The agent made no changes; nothing to propose this hour." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          title="DiagramWeave autonomous product increment"
          body_file="$RUNNER_TEMP/pr-body.md"
          if [ -f PR_MESSAGE.md ]; then
            candidate_title="$(head -n 1 PR_MESSAGE.md | sed 's/^#\+ *//')"
            [ -n "$candidate_title" ] && title="$candidate_title"
            tail -n +2 PR_MESSAGE.md >"$body_file"
            rm -f PR_MESSAGE.md
          else
            echo "Autonomous NVIDIA NIM increment; see the diff and CHANGELOG.md." \
              >"$body_file"
          fi

          branch="nim-agent/product-dev-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "$title"
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${branch}"
          pr_url="$(
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "$title" \
              --body-file "$body_file"
          )"
          {
            echo "Opened bounded pull request: $pr_url"
            echo "Central PR governance owns review, repair, revalidation, and merge."
          } >>"$GITHUB_STEP_SUMMARY"
