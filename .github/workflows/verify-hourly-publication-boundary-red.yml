name: Verify isolated publication RED contract

on:
  push:
    branches:
      - security/isolated-autonomous-publication

concurrency:
  group: verify-isolated-publication-red
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-red:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out exact security branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/isolated-autonomous-publication
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 24
          package-manager-cache: false

      - name: Confirm four-plane authority contract is RED
        shell: bash
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/hourly-publication-boundary-red.log"
          set +e
          node --test tests/hourly-publication-boundary-contract.test.js \
            >"$output_file" 2>&1
          test_status=$?
          set -e
          cat "$output_file"

          if [ "$test_status" -eq 0 ]; then
            echo "::error::The isolated publication contract unexpectedly passed before workflow separation."
            exit 1
          fi
          grep -F 'select-work job must exist' "$output_file"
          grep -F 'propose job must exist' "$output_file"
          grep -F 'verify-proposal job must exist' "$output_file"
          grep -F 'fail 5' "$output_file"
          echo "All five authority contracts failed because the current workflow is still a single mixed-authority job." \
            >>"$GITHUB_STEP_SUMMARY"
