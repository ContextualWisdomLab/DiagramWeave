name: Apply CLI Foundation From Review

on:
  pull_request:
    types:
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: apply-cli-foundation-${{ github.repository }}-agent-cli-foundation
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: >-
      github.repository == 'ContextualWisdomLab/DiagramWeave' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/cli-foundation'
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the exact triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Verify the immutable implementation base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin refs/heads/agent/cli-foundation | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Materialize the reviewed CLI tree
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/apply-cli-foundation.mjs
          node scripts/apply-cli-foundation.mjs
          chmod 0755 packages/cli/src/bin.js
          rm -f scripts/apply-cli-foundation.mjs
          rm -f .github/workflows/apply-cli-foundation.yml
          rm -f .github/workflows/apply-cli-foundation-pr.yml

      - name: Update and install the locked workspace
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify the materialized repository and package
        shell: bash
        run: |
          set -euo pipefail
          npm run verify 2>&1 | tee /tmp/diagramweave-cli-verify.log
          npm pack --workspace packages/cli --dry-run --json > /tmp/diagramweave-cli-pack.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const reports = JSON.parse(readFileSync('/tmp/diagramweave-cli-pack.json', 'utf8'));
          if (!Array.isArray(reports) || reports.length !== 1) {
            throw new Error('Expected exactly one CLI package dry-run report.');
          }
          const files = reports[0]?.files;
          if (!Array.isArray(files) || !files.some(({ path }) => path === 'package.json')) {
            throw new Error('CLI package dry run must contain package.json.');
          }
          const allowed = /^(?:LICENSE|README\.md|package\.json|src\/[A-Za-z0-9._-]+\.js)$/u;
          for (const file of files) {
            if (typeof file?.path !== 'string' || !allowed.test(file.path)) {
              throw new Error(`Unexpected CLI package file: ${String(file?.path)}`);
            }
          }
          NODE

      - name: Record exact verification evidence
        shell: bash
        run: |
          set -euo pipefail
          test_count="$(grep -E 'tests [0-9]+$' /tmp/diagramweave-cli-verify.log | tail -1 | grep -oE '[0-9]+$')"
          syntax_count="$(grep -Eo 'Syntax check passed for [0-9]+ JavaScript files\.' /tmp/diagramweave-cli-verify.log | tail -1 | grep -oE '[0-9]+')"
          docstring_count="$(grep -Eo 'Docstring check passed for [0-9]+ production modules\.' /tmp/diagramweave-cli-verify.log | tail -1 | grep -oE '[0-9]+')"
          package_count="$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const [report] = JSON.parse(readFileSync('/tmp/diagramweave-cli-pack.json', 'utf8'));
          process.stdout.write(String(report.files.length));
          NODE
          )"
          test -n "$test_count"
          test -n "$syntax_count"
          test -n "$docstring_count"
          test -n "$package_count"
          TEST_COUNT="$test_count" \
          SYNTAX_COUNT="$syntax_count" \
          DOCSTRING_COUNT="$docstring_count" \
          PACKAGE_COUNT="$package_count" \
          python3 <<'PY'
          from os import environ
          from pathlib import Path

          path = Path('docs/superpowers/plans/2026-08-04-cli-foundation.md')
          source = path.read_text(encoding='utf-8').replace('- [ ]', '- [x]')
          marker = '\n## Final verification evidence\n'
          if marker in source:
            source = source.split(marker, 1)[0].rstrip() + '\n'
          evidence = f"""
          ## Final verification evidence

          The exact clean implementation tree was verified before publication:

          ```text
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          {environ['TEST_COUNT']} tests passed
          production line coverage: 100%
          production branch coverage: 100%
          production function coverage: 100%
          production JSDoc modules: {environ['DOCSTRING_COUNT']}
          JavaScript syntax files: {environ['SYNTAX_COUNT']}
          skipped/todo tests: 0
          npm pack --workspace packages/cli --dry-run --json
          packaged files: {environ['PACKAGE_COUNT']}
          ```

          Residual product limits remain explicit: no structured PlantUML line diagnostics, no Studio, no Language Server, no concurrent folder renderer, no formatting or policy command, and no bundled Java or PlantUML runtime. Versions remain `0.0.0` and the changelog remains under `Unreleased`.
          """
          path.write_text(source.rstrip() + '\n' + evidence, encoding='utf-8')
          PY

      - name: Reverify the exact evidence-bearing tree
        shell: bash
        run: |
          set -euo pipefail
          npm run verify
          npm pack --workspace packages/cli --dry-run --json > /tmp/diagramweave-cli-pack-final.json
          cmp <(node -e "const r=require('/tmp/diagramweave-cli-pack.json'); console.log(JSON.stringify(r[0].files.map(f=>f.path)))") \
              <(node -e "const r=require('/tmp/diagramweave-cli-pack-final.json'); console.log(JSON.stringify(r[0].files.map(f=>f.path)))")

      - name: Commit and publish the verified clean tree
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/agent/cli-foundation | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          test ! -e scripts/apply-cli-foundation.mjs
          test ! -e .github/workflows/apply-cli-foundation.yml
          test ! -e .github/workflows/apply-cli-foundation-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat(cli): add deterministic validate and render commands'
          git push origin HEAD:refs/heads/agent/cli-foundation
