name: Hourly PR Maintenance

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print planned actions without mutating pull requests
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "13 * * * *"

concurrency:
  group: hourly-pr-maintenance-${{ github.repository }}
  cancel-in-progress: false

# Repository-local orchestration is read-only by default. The review-fix
# dispatch job requests an OIDC token only long enough to mint a short-lived
# OpenCode GitHub App installation token; no stored cross-repository token is
# required. The pinned merge scheduler narrows its own elevated permissions.
permissions:
  contents: read

jobs:
  dispatch-review-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ inputs.dry_run || false }}
      OIDC_AUDIENCE: opencode-github-action
      OPENCODE_API_BASE_URL: https://api.opencode.ai
    steps:
      - name: Dispatch bounded review-feedback repair
        shell: bash
        run: |
          set -euo pipefail

          payload="$(jq -cn \
            --arg event_type "pr-review-fix-scheduler" \
            --arg target_repository "ContextualWisdomLab/DiagramWeave" \
            --arg base_branch "main" \
            --arg retry_hours "1" \
            --arg max_dispatches "1" \
            --arg max_prs "20" \
            --argjson dry_run "$( [ "$DRY_RUN" = "true" ] && printf true || printf false )" \
            '{
              event_type: $event_type,
              client_payload: {
                target_repository: $target_repository,
                base_branch: $base_branch,
                retry_hours: $retry_hours,
                max_dispatches: $max_dispatches,
                max_prs: $max_prs,
                dry_run: $dry_run
              }
            }')"

          if [ "$DRY_RUN" = "true" ]; then
            echo "reason=dry_run" >>"$GITHUB_STEP_SUMMARY"
            jq . <<<"$payload" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          mark_token_unavailable() {
            echo "reason=opencode_app_token_unavailable" >>"$GITHUB_STEP_SUMMARY"
            echo "::error::OpenCode GitHub App token exchange is unavailable; refusing an unauthenticated central repair dispatch."
          }

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            mark_token_unavailable
            exit 1
          fi

          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator="&"
          case "$request_url" in
            *\?*) ;;
            *) separator="?" ;;
          esac

          if ! oidc_response="$(
            curl -fsS \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${request_url}${separator}audience=${OIDC_AUDIENCE}"
          )"; then
            mark_token_unavailable
            exit 1
          fi

          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          if [ -z "$oidc_token" ]; then
            mark_token_unavailable
            exit 1
          fi

          if ! token_response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              "${OPENCODE_API_BASE_URL}/exchange_github_app_token"
          )"; then
            mark_token_unavailable
            exit 1
          fi

          central_dispatch_token="$(jq -r '.token // empty' <<<"$token_response")"
          if [ -z "$central_dispatch_token" ]; then
            mark_token_unavailable
            exit 1
          fi
          echo "::add-mask::$central_dispatch_token"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${central_dispatch_token}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/ContextualWisdomLab/.github/dispatches"
          echo "reason=central_review_fix_dispatched" >>"$GITHUB_STEP_SUMMARY"

  review-merge:
    needs: dispatch-review-fix
    if: ${{ always() }}
    permissions:
      actions: write
      checks: read
      contents: write
      id-token: write
      pull-requests: write
      statuses: read
    uses: ContextualWisdomLab/.github/.github/workflows/pr-review-merge-scheduler.yml@3f65dbee6672b78802e7d71d49c390f3817bb03b
    with:
      base_branch: "main"
      branch_update_limit: "1"
      dry_run: ${{ inputs.dry_run || false }}
      enable_auto_merge: true
      max_prs: "20"
      merge_mode: "direct_or_auto"
      project_flow: "github-flow"
      review_dispatch_limit: "1"
      stale_opencode_minutes: "60"
      trigger_reviews: true
      update_branches: true
    secrets: inherit
