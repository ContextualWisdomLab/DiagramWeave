name: Finish folding-range merge-gate repair

on:
  push:
    branches:
      - agent/conservative-folding-ranges
    paths:
      - .github/workflows/run-repair-folding-docs-v4.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finish-folding-range-merge-gate-repair
  cancel-in-progress: false

jobs:
  repair:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/conservative-folding-ranges
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply reviewed durable documentation repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source_workflow = Path('.github/workflows/repair-folding-docs.yml')
          workflow = source_workflow.read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          if workflow.count(start) != 1 or workflow.count(end) != 1:
              raise SystemExit('repair workflow does not contain one extractable Python program')
          program = workflow.split(start, 1)[1].split(end, 1)[0]
          exec(compile(dedent(program), 'repair-folding-docs.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Resolve exact review contracts and restore direct-layer coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_or_confirm(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding='utf-8')
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1 and new_count == 0:
                  file_path.write_text(text.replace(old, new), encoding='utf-8')
                  return
              if old_count == 0 and new_count == 1:
                  return
              raise SystemExit(
                  f'{path}: expected exactly one old or new contract; '
                  f'old={old_count}, new={new_count}'
              )

          replace_or_confirm(
              'docs/product/folding-ranges.md',
              'A client that negotiates the LSP 3.18 `textDocument.foldingRange` capability\nreceives deterministic, source-order package and namespace folds from the same\nauthoritative scanner used by document outlines.',
              'A client that negotiates the LSP 3.18 `textDocument.foldingRange` capability can\nrequest `textDocument/foldingRange` and receive deterministic, source-order\npackage and namespace folds from the same authoritative scanner used by document\noutlines.',
          )
          replace_or_confirm(
              'docs/product/diagramweave-prd.md',
              'legacy `SymbolInformation[]` compatibility와 `textDocument/foldingRange` 구현은 완료됐고, completion resolve, semantic member completion, hover, definition, references, rename, arbitrary region folding과 workspace indexing은 아직 구현되지 않았다.',
              'legacy `SymbolInformation[]` compatibility 구현은 완료됐고, `textDocument/foldingRange` 구현도 완료됐다. completion resolve, semantic member completion, hover, definition, references, rename, arbitrary region folding과 workspace indexing은 아직 구현되지 않았다.',
          )
          replace_or_confirm(
              'docs/operations/folding-ranges.md',
              'A missing, malformed, array-valued, proxied, revoked, or throwing capability\npath does not advertise the provider. A request in that session returns the\nfixed `method_not_found` Language Server error.',
              'A missing or hostile capability path—including malformed, array-valued,\nproxied, revoked, or throwing records—does not advertise the provider. A request\nin that session returns the fixed `method_not_found` Language Server error.',
          )
          replace_or_confirm(
              'docs/product/folding-ranges.md',
              'This backend slice exposes a standard LSP capability and does not add a\nDiagramWeave Studio visual component, so it does not require a new Figma\nartifact. Product Design and Figma become mandatory when Studio adds explicit\n',
              'This backend slice exposes a standard LSP capability and does not add a\nDiagramWeave Studio visual component, so it does not require a new Figma artifact.\nProduct Design and Figma become mandatory when Studio adds explicit\n',
          )

          test_path = Path('packages/language-server/test/completion-session.test.js')
          test_text = test_path.read_text(encoding='utf-8')
          import_old = "import test from 'node:test';\n\n"
          import_new = (
              "import test from 'node:test';\n\n"
              "import { createCompletionLanguageServerSession } "
              "from '../src/completion-session.js';\n"
          )
          if "from '../src/completion-session.js';" not in test_text:
              if test_text.count(import_old) != 1:
                  raise SystemExit('completion-session test import insertion point is ambiguous')
              test_text = test_text.replace(import_old, import_new, 1)

          test_name = 'completion layer normalizes hostile document mutation boundaries'
          if test_name not in test_text:
              test_text = test_text.rstrip() + '\n\n' + dedent("""
              test('completion layer normalizes hostile document mutation boundaries', async () => {
                const session = createCompletionLanguageServerSession({
                  javaPath,
                  jarPath,
                  rendererFactory: () => Object.freeze({
                    async render() {
                      return Object.freeze({});
                    },
                  }),
                  async publishNotification() {},
                });
                await initialize(session);

                const hostileOpen = Object.defineProperty({}, 'textDocument', {
                  get() {
                    throw new Error('secret open getter');
                  },
                });
                for (const params of [null, {}, { textDocument: null }, hostileOpen]) {
                  await assert.rejects(
                    session.notify('textDocument/didOpen', params),
                    (error) => assertError(error, 'invalid_request'),
                  );
                }
                await assert.rejects(
                  session.notify(
                    'textDocument/didOpen',
                    openParams('class Remote', 1, 'https://example.com/remote.puml'),
                  ),
                  (error) => assertError(error, 'document_uri_invalid'),
                );
                await session.notify('textDocument/didOpen', openParams('class Accepted'));

                const hostileChanges = new Proxy([], {
                  get(target, property, receiver) {
                    if (property === 'length') {
                      throw new Error('secret change length');
                    }
                    return Reflect.get(target, property, receiver);
                  },
                });
                const hostileChange = new Proxy({}, {
                  get(target, property, receiver) {
                    if (property === 'range') {
                      throw new Error('secret change range');
                    }
                    return Reflect.get(target, property, receiver);
                  },
                });
                for (const params of [
                  null,
                  {},
                  { textDocument: { uri, version: 2 }, contentChanges: hostileChanges },
                  { textDocument: { uri, version: 2 }, contentChanges: [hostileChange] },
                ]) {
                  await assert.rejects(
                    session.notify('textDocument/didChange', params),
                    (error) => assertError(error, 'invalid_request'),
                  );
                }
                await assert.rejects(
                  session.notify(
                    'textDocument/didChange',
                    changeParams('class Remote', 2, 'https://example.com/remote.puml'),
                  ),
                  (error) => assertError(error, 'document_uri_invalid'),
                );
                await assert.rejects(
                  session.notify('textDocument/didChange', {
                    textDocument: { uri, version: 2 },
                    contentChanges: [{ text: 'class Incremental', range: {} }],
                  }),
                  (error) => assertError(error, 'incremental_change_unsupported'),
                );

                const hostileClose = Object.defineProperty({}, 'textDocument', {
                  get() {
                    throw new Error('secret close getter');
                  },
                });
                for (const params of [null, {}, { textDocument: null }, hostileClose]) {
                  await assert.rejects(
                    session.notify('textDocument/didClose', params),
                    (error) => assertError(error, 'invalid_request'),
                  );
                }
                await assert.rejects(
                  session.notify('textDocument/didClose', {
                    textDocument: { uri: 'https://example.com/remote.puml' },
                  }),
                  (error) => assertError(error, 'document_uri_invalid'),
                );
              });
              """).lstrip()
          test_path.write_text(test_text, encoding='utf-8')
          PY

      - name: Remove every temporary repair workflow from the candidate tree
        shell: bash
        run: |
          rm -f \
            .github/workflows/repair-folding-docs.yml \
            .github/workflows/run-repair-folding-docs.yml \
            .github/workflows/run-repair-folding-docs-v2.yml \
            .github/workflows/run-repair-folding-docs-v3.yml \
            .github/workflows/run-repair-folding-docs-v4.yml \
            .github/workflows/prepare-folding-repair-artifact.yml

      - name: Install and verify exact candidate tree
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          node scripts/check-package-contents.mjs
          git diff --check

      - name: Commit and push the verified clean tree
        shell: bash
        run: |
          git config user.name "DiagramWeave Merge-Gate Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: satisfy folding-range merge gates"
          git push origin HEAD:agent/conservative-folding-ranges
