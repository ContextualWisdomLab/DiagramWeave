name: Verify hourly proposal adversarial RED contract

on:
  push:
    branches:
      - security/isolated-autonomous-publication

concurrency:
  group: verify-hourly-proposal-adversarial-red
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-red:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out exact security branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/isolated-autonomous-publication
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 24
          package-manager-cache: false

      - name: Confirm adversarial contracts expose the intended missing guards
        shell: bash
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/hourly-proposal-adversarial-red.log"
          set +e
          node --test tests/hourly-proposal-bundle-adversarial.test.js \
            >"$output_file" 2>&1
          test_status=$?
          set -e
          cat "$output_file"

          if [ "$test_status" -eq 0 ]; then
            echo "::error::Adversarial proposal contracts unexpectedly passed before hardening."
            exit 1
          fi
          grep -F 'Missing expected rejection' "$output_file"
          grep -F 'fail 5' "$output_file"
          echo "Five adversarial contracts failed because the artifact guards are not implemented yet." \
            >>"$GITHUB_STEP_SUMMARY"
