name: Apply Renderer Review Fixes

on:
  push:
    branches:
      - agent/renderer-hardening
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: apply-renderer-review-fixes-${{ github.repository }}-agent-renderer-hardening
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: >-
      github.repository == 'ContextualWisdomLab/DiagramWeave' &&
      (github.event_name == 'push' || github.head_ref == 'agent/renderer-hardening')
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: agent/renderer-hardening
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply reviewed renderer implementation
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/review-fixes.patch.b64 > /tmp/review-fixes.patch
          git apply --check \
            --include=packages/plantuml-renderer/src/renderer.js \
            /tmp/review-fixes.patch
          git apply \
            --include=packages/plantuml-renderer/src/renderer.js \
            /tmp/review-fixes.patch
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          function replaceExactly(path, before, after, label) {
            const text = readFileSync(path, 'utf8');
            const occurrences = text.split(before).length - 1;
            if (occurrences !== 1) {
              throw new Error(`${label}: expected one target, found ${occurrences}`);
            }
            writeFileSync(path, text.replace(before, after));
          }

          replaceExactly(
            'packages/plantuml-renderer/src/renderer.js',
            `      const end = findDoctypeEnd(text, cursor + 9, boundary);
      if (end === -1) {
        return false;
      }`,
            `      const nameStart = skipDocumentWhitespace(text, cursor + 9, boundary, 1);
      if (
        !matchesAsciiToken(text, nameStart, 'svg') ||
        !isXmlNameBoundary(text[nameStart + 3])
      ) {
        return false;
      }
      const end = findDoctypeEnd(text, nameStart + 3, boundary);
      if (end === -1) {
        return false;
      }`,
            'SVG DOCTYPE root validation',
          );

          replaceExactly(
            'packages/plantuml-renderer/test/hardening.test.js',
            `    '<!DOCTYPE html><svg/>',
    '<!DOCTYPE svg [<!ELEMENT svg ANY><svg/>',`,
            `    '<!DOCTYPE html><svg/>',
    '<!DOCTYPE svgx><svg/>',
    '<!DOCTYPE svg [<!ELEMENT svg ANY><svg/>',`,
            'SVG DOCTYPE name-boundary regression',
          );
          NODE
          rm -rf .bootstrap
          rm -f .github/workflows/apply-renderer-review-fixes.yml
      - name: Install locked workspace
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify exact patched tree
        shell: bash
        run: |
          set -euo pipefail
          npm run verify
          npm pack --workspace packages/plantuml-renderer --dry-run --json > /tmp/renderer-pack.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const reports = JSON.parse(readFileSync('/tmp/renderer-pack.json', 'utf8'));
          if (!Array.isArray(reports) || reports.length !== 1) {
            throw new Error('Expected exactly one package dry-run report.');
          }
          const files = reports[0]?.files;
          if (!Array.isArray(files) || !files.some(({ path }) => path === 'package.json')) {
            throw new Error('Package dry run must contain package.json.');
          }
          const allowed = /^(?:LICENSE|README\.md|package\.json|src\/[A-Za-z0-9._-]+\.js)$/u;
          for (const file of files) {
            if (typeof file?.path !== 'string' || !allowed.test(file.path)) {
              throw new Error(`Unexpected packaged file: ${String(file?.path)}`);
            }
          }
          NODE
      - name: Commit verified review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: accept safe SVG prologues and lock documentation contracts'
          git push origin HEAD:agent/renderer-hardening
