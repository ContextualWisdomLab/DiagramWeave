name: Apply Renderer Review Fixes

on:
  push:
    branches:
      - agent/renderer-hardening
  pull_request:
    types:
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: apply-renderer-review-fixes-${{ github.repository }}-agent-renderer-hardening
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: >-
      github.repository == 'ContextualWisdomLab/DiagramWeave' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD }}
      - name: Verify the immutable repair base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin refs/heads/agent/renderer-hardening | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply deterministic reviewed transformations
        run: node scripts/apply-renderer-review-fixes.mjs
      - name: Remove one-shot repair inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f scripts/apply-renderer-review-fixes.mjs
          rm -f .github/workflows/apply-renderer-review-fixes.yml
      - name: Install locked workspace
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the exact repaired tree
        shell: bash
        run: |
          set -euo pipefail
          npm run verify
          npm pack --workspace packages/plantuml-renderer --dry-run --json > /tmp/renderer-pack.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const reports = JSON.parse(readFileSync('/tmp/renderer-pack.json', 'utf8'));
          if (!Array.isArray(reports) || reports.length !== 1) {
            throw new Error('Expected exactly one package dry-run report.');
          }
          const files = reports[0]?.files;
          if (!Array.isArray(files) || !files.some(({ path }) => path === 'package.json')) {
            throw new Error('Package dry run must contain package.json.');
          }
          const allowed = /^(?:LICENSE|README\.md|package\.json|src\/[A-Za-z0-9._-]+\.js)$/u;
          for (const file of files) {
            if (typeof file?.path !== 'string' || !allowed.test(file.path)) {
              throw new Error(`Unexpected packaged file: ${String(file?.path)}`);
            }
          }
          NODE
      - name: Commit and publish the verified clean tree
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/agent/renderer-hardening | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: validate complete SVG XML structure'
          git push origin HEAD:refs/heads/agent/renderer-hardening
