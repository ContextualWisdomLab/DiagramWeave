name: Apply Renderer Review Fixes

on:
  push:
    branches:
      - agent/renderer-hardening

permissions:
  contents: read

concurrency:
  group: apply-renderer-review-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.repository == 'ContextualWisdomLab/DiagramWeave'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: agent/renderer-hardening
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/review-fixes.patch.b64 > /tmp/review-fixes.patch
          printf '%s  %s\n' \
            '0ef241b96ff24878c1eb406a28e6b8ffb0236b827cf409de0b658fb9c39b0edb' \
            '/tmp/review-fixes.patch' | sha256sum --check --strict
          git apply --check /tmp/review-fixes.patch
          git apply /tmp/review-fixes.patch
          rm -rf .bootstrap
          rm -f .github/workflows/apply-renderer-review-fixes.yml
      - name: Install locked workspace
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify exact patched tree
        shell: bash
        run: |
          set -euo pipefail
          npm run verify
          npm pack --workspace packages/plantuml-renderer --dry-run --json > /tmp/renderer-pack.json
          jq -e '
            length == 1 and
            ([.[0].files[].path] | index("package.json") != null) and
            all(
              .[0].files[].path;
              . == "LICENSE" or
              . == "README.md" or
              . == "package.json" or
              test("^src/[A-Za-z0-9._-]+\\.js$")
            )
          ' /tmp/renderer-pack.json >/dev/null
      - name: Commit verified review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: accept safe SVG prologues and lock documentation contracts'
          git push origin HEAD:agent/renderer-hardening
