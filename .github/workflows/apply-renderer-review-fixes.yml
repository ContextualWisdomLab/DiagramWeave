name: Apply Renderer Review Fixes

on:
  push:
    branches:
      - agent/renderer-hardening
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: apply-renderer-review-fixes-${{ github.repository }}-agent-renderer-hardening
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: >-
      github.repository == 'ContextualWisdomLab/DiagramWeave' &&
      (github.event_name == 'push' || github.head_ref == 'agent/renderer-hardening')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: agent/renderer-hardening
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply reviewed fixes deterministically
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_exactly(path: str, before: str, after: str, label: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(before)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one replacement target, found {count}')
              target.write_text(text.replace(before, after, 1), encoding='utf-8')

          renderer_path = 'packages/plantuml-renderer/src/renderer.js'
          insertion_anchor = r'''  return -1;
}

/**
 * Return whether one complete opening tag uses the XML empty-element marker.'''
          prologue_helpers = r'''  return -1;
}

/**
 * Find the end of a bounded processing instruction or comment.
 *
 * @param {string} text - Decoded candidate document.
 * @param {number} index - First character after the opening delimiter.
 * @param {string} delimiter - Closing delimiter.
 * @param {number} boundary - Exclusive document boundary.
 * @returns {number} First index after the delimiter, or -1 when incomplete.
 */
function findDelimitedMarkupEnd(text, index, delimiter, boundary) {
  const end = text.indexOf(delimiter, index);
  return end === -1 || end + delimiter.length > boundary
    ? -1
    : end + delimiter.length;
}

/**
 * Find the end of one XML document type declaration.
 *
 * The scan respects quoted identifiers and an optional internal subset so a
 * declaration containing nested greater-than characters does not terminate early.
 *
 * @param {string} text - Decoded candidate document.
 * @param {number} index - First character after the DOCTYPE keyword.
 * @param {number} boundary - Exclusive document boundary.
 * @returns {number} First index after the declaration, or -1 when malformed.
 */
function findDoctypeEnd(text, index, boundary) {
  let quote = null;
  let subsetDepth = 0;
  for (let cursor = index; cursor < boundary; cursor += 1) {
    const character = text[cursor];
    if (quote !== null) {
      if (character === quote) {
        quote = null;
      }
    } else if (character === '"' || character === "'") {
      quote = character;
    } else if (character === '[') {
      subsetDepth += 1;
    } else if (character === ']') {
      if (subsetDepth === 0) {
        return -1;
      }
      subsetDepth -= 1;
    } else if (character === '>' && subsetDepth === 0) {
      return cursor + 1;
    }
  }
  return -1;
}

/**
 * Return whether a processing instruction uses the reserved XML target.
 *
 * @param {string} text - Decoded candidate document.
 * @param {number} index - Processing-instruction start.
 * @param {number} boundary - Exclusive document boundary.
 * @returns {boolean} True for a case-insensitive XML target boundary.
 */
function isXmlDeclarationTarget(text, index, boundary) {
  const targetEnd = index + 5;
  if (targetEnd >= boundary || !matchesAsciiToken(text, index, '<?xml')) {
    return false;
  }
  const character = text[targetEnd];
  return character === '?' || isDocumentWhitespace(character);
}

/**
 * Skip the restricted XML prologue accepted before the SVG root.
 *
 * One XML declaration may appear first. Comments, non-XML processing
 * instructions, and one SVG DOCTYPE may follow. Any other declaration, a
 * duplicate XML declaration, a duplicate DOCTYPE, or malformed markup fails
 * closed so non-SVG wrappers cannot be skipped accidentally.
 *
 * @param {string} text - Decoded candidate document.
 * @param {number} index - First non-whitespace document index.
 * @param {number} boundary - Exclusive document boundary.
 * @returns {number|false} First actual element index, or false when malformed.
 */
function skipSvgPrologue(text, index, boundary) {
  let cursor = index;
  let sawNode = false;
  let sawDoctype = false;
  while (cursor < boundary) {
    if (isXmlDeclarationTarget(text, cursor, boundary)) {
      if (sawNode) {
        return false;
      }
      const end = findDelimitedMarkupEnd(text, cursor + 5, '?>', boundary);
      if (end === -1) {
        return false;
      }
      sawNode = true;
      cursor = skipDocumentWhitespace(text, end, boundary, 1);
      continue;
    }
    if (text.startsWith('<!--', cursor)) {
      const end = findDelimitedMarkupEnd(text, cursor + 4, '-->', boundary);
      if (end === -1) {
        return false;
      }
      sawNode = true;
      cursor = skipDocumentWhitespace(text, end, boundary, 1);
      continue;
    }
    if (text.startsWith('<?', cursor)) {
      const end = findDelimitedMarkupEnd(text, cursor + 2, '?>', boundary);
      if (end === -1) {
        return false;
      }
      sawNode = true;
      cursor = skipDocumentWhitespace(text, end, boundary, 1);
      continue;
    }
    if (
      matchesAsciiToken(text, cursor, '<!doctype') &&
      cursor + 9 < boundary &&
      isDocumentWhitespace(text[cursor + 9])
    ) {
      if (sawDoctype) {
        return false;
      }
      const nameStart = skipDocumentWhitespace(text, cursor + 9, boundary, 1);
      if (
        !matchesAsciiToken(text, nameStart, 'svg') ||
        !isXmlNameBoundary(text[nameStart + 3])
      ) {
        return false;
      }
      const end = findDoctypeEnd(text, nameStart + 3, boundary);
      if (end === -1) {
        return false;
      }
      sawNode = true;
      sawDoctype = true;
      cursor = skipDocumentWhitespace(text, end, boundary, 1);
      continue;
    }
    return cursor;
  }
  return cursor;
}

/**
 * Return whether one complete opening tag uses the XML empty-element marker.'''
          replace_exactly(
              renderer_path,
              insertion_anchor,
              prologue_helpers,
              'renderer prologue helper insertion',
          )
          old_declaration = r'''  if (matchesAsciiToken(text, start, '<?xml')) {
    const declarationEnd = text.indexOf('?>', start + 5);
    if (declarationEnd === -1 || declarationEnd + 2 > end) {
      return false;
    }
    start = skipDocumentWhitespace(text, declarationEnd + 2, end, 1);
  }
'''
          new_declaration = r'''  start = skipSvgPrologue(text, start, end);
  if (start === false || start === end) {
    return false;
  }
'''
          replace_exactly(
              renderer_path,
              old_declaration,
              new_declaration,
              'renderer prologue call',
          )

          hardening_path = 'packages/plantuml-renderer/test/hardening.test.js'
          accepted_before = r'''    '<?xml version="1.0"?><svg><!-- comment --><![CDATA[<svg></svg>]]><?instruction value?><g data-value=">">text</g><svg /></svg>',
    '<svg><svg/><svg></svg></svg>','''
          accepted_after = r'''    '<?xml version="1.0"?><svg><!-- comment --><![CDATA[<svg></svg>]]><?instruction value?><g data-value=">">text</g><svg /></svg>',
    '<!-- generated --><svg/>',
    '<?plantuml 1.2026.7?><svg/>',
    '<!DOCTYPE svg><svg/>',
    '<!DOCTYPE svg [<!ELEMENT svg ANY><!ENTITY label "a>b">]><svg/>',
    '<!DOCTYPE svg SYSTEM "urn:diagram:weave"><svg/>',
    '<?xml version="1.0"?><!-- generated --><?plantuml 1.2026.7?><!DOCTYPE svg><svg/>',
    '<svg><svg/><svg></svg></svg>','''
          replace_exactly(
              hardening_path,
              accepted_before,
              accepted_after,
              'accepted SVG prologue cases',
          )
          rejected_before = r'''    '<?xml version="1.0"<svg></svg>',
    '<!-- unterminated<svg></svg>','''
          rejected_after = r'''    '<?xml version="1.0"<svg></svg>',
    '<!-- generated --><?xml version="1.0"?><svg/>',
    '<?xml version="1.0"?><?xml version="1.0"?><svg/>',
    '<!DOCTYPE svg><!DOCTYPE svg><svg/>',
    '<!DOCTYPE html><svg/>',
    '<!DOCTYPE svg [<!ELEMENT svg ANY><svg/>',
    '<!DOCTYPE svg ]><svg/>',
    '<!-- generated -->',
    '<!ENTITY svg "external"><svg/>',
    '<!-- unterminated<svg></svg>','''
          replace_exactly(
              hardening_path,
              rejected_before,
              rejected_after,
              'rejected SVG prologue cases',
          )

          replace_exactly(
              'packages/plantuml-renderer/README.md',
              "`spawnImpl` is a deterministic test-only seam used by this package's process-boundary tests. It is not a production extension point; production hosts must omit `spawnImpl` so the package uses Node.js `spawn` with the fixed command contract.",
              "spawnImpl is a test-only process seam. It supports this package's deterministic process-boundary tests and is not a production extension point. Production hosts must omit `spawnImpl` so the package uses Node.js `spawn` with the fixed command contract.",
              'package README process seam contract',
          )
          replace_exactly(
              'docs/operations/plantuml-renderer.md',
              '`spawnImpl` is a test-only process seam. Production hosts must omit it so the package uses Node.js `spawn` with the fixed argument, environment, and stdio contract documented above.',
              'spawnImpl is a test-only process seam. Production hosts must omit `spawnImpl` so the package uses Node.js `spawn` with the fixed argument, environment, and stdio contract documented above.',
              'operations process seam contract',
          )

          Path('tests/renderer-hardening-contract.test.js').write_text(
              r'''import assert from 'node:assert/strict';
import { readFile } from 'node:fs/promises';
import test from 'node:test';

async function readRepositoryFile(path) {
  return readFile(new URL(`../${path}`, import.meta.url), 'utf8');
}

test('renderer documentation exposes limits and keeps the process seam test-only', async () => {
  const rootReadme = await readRepositoryFile('README.md');
  const packageReadme = await readRepositoryFile('packages/plantuml-renderer/README.md');
  const operations = await readRepositoryFile('docs/operations/plantuml-renderer.md');

  assert.match(rootReadme, /plantUmlRendererLimits/);
  assert.match(packageReadme, /plantUmlRendererLimits/);
  assert.match(packageReadme, /spawnImpl is a test-only process seam\./i);
  assert.match(packageReadme, /production hosts must omit `spawnImpl`/i);
  assert.match(operations, /plantUmlRendererLimits/);
  assert.match(operations, /spawnImpl is a test-only process seam\./i);
  assert.match(operations, /production hosts must omit `spawnImpl`/i);
  assert.match(
    operations,
    /^\|\s*deadline\s*\|\s*15 seconds\s*\|\s*10 ms–120 seconds\s*\|$/im,
  );
  assert.match(
    operations,
    /^\|\s*source\s*\|\s*1 MiB UTF-8\s*\|\s*1 byte–16 MiB\s*\|$/im,
  );
});
''',
              encoding='utf-8',
          )

          replace_exactly(
              'CHANGELOG.md',
              'single-pass SVG document validation',
              'single-pass SVG document and restricted XML prologue validation',
              'CHANGELOG renderer validation description',
          )
          PY
          rm -rf .bootstrap
          rm -f .github/workflows/apply-renderer-review-fixes.yml
      - name: Install locked workspace
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify exact patched tree
        shell: bash
        run: |
          set -euo pipefail
          npm run verify
          npm pack --workspace packages/plantuml-renderer --dry-run --json > /tmp/renderer-pack.json
          jq -e '
            length == 1 and
            ([.[0].files[].path] | index("package.json") != null) and
            all(
              .[0].files[].path;
              . == "LICENSE" or
              . == "README.md" or
              . == "package.json" or
              test("^src/[A-Za-z0-9._-]+\\.js$")
            )
          ' /tmp/renderer-pack.json >/dev/null
      - name: Commit verified review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: accept safe SVG prologues and lock documentation contracts'
          git push origin HEAD:agent/renderer-hardening
      - name: Return the verified pull request to review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 3 --repo "$GITHUB_REPOSITORY"
