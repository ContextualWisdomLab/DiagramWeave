name: Bootstrap Renderer Hardening

on:
  push:
    branches:
      - agent/renderer-hardening

permissions:
  contents: write

concurrency:
  group: bootstrap-renderer-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-and-verify:
    if: github.repository == 'ContextualWisdomLab/DiagramWeave'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Assemble reviewed renderer source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/renderer/part* | base64 --decode > packages/plantuml-renderer/src/renderer.js
          printf '%s  %s\n' \
            '9e14ad7139a6d2255c690cd24625c4220dacae4db09ba127c851398f76ce4596' \
            'packages/plantuml-renderer/src/renderer.js' | sha256sum --check --strict
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-renderer-hardening.yml
      - name: Install locked workspace
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify exact assembled tree
        run: |
          set -euo pipefail
          npm run verify
          npm pack --workspace packages/plantuml-renderer --dry-run --json > /tmp/renderer-pack.json
          jq -e 'length == 1 and .[0].files | all(.path | startswith("package/"))' /tmp/renderer-pack.json >/dev/null
      - name: Commit verified clean tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'perf: harden PlantUML SVG validation and limits'
          git push origin HEAD:agent/renderer-hardening
