name: Repair hourly product no-op fallback

on:
  push:
    branches:
      - fix/hourly-product-noop-fallback

concurrency:
  group: repair-hourly-product-noop-fallback
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/hourly-product-noop-fallback
          fetch-depth: 0

      - name: Confirm test-first RED contract
        shell: bash
        run: |
          set -euo pipefail
          if node --test tests/hourly-noop-fallback-contract.test.js; then
            echo "::error::The no-op fallback contract unexpectedly passed before production repair."
            exit 1
          fi
          echo "Confirmed the new no-op fallback contract fails on the unrepaired workflow." \
            >>"$GITHUB_STEP_SUMMARY"

      - name: Apply test-backed scheduler repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/repair-hourly-product-noop.py

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify complete repository
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          node scripts/check-package-contents.mjs

      - name: Commit verified repair and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ci): continue after clean no-op agent completion"
          git push origin HEAD:fix/hourly-product-noop-fallback
