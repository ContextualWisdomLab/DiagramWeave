name: Harden hourly candidate cleanup

on:
  push:
    branches:
      - fix/hourly-product-noop-fallback

concurrency:
  group: harden-hourly-candidate-cleanup
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-slim
    timeout-minutes: 25
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/hourly-product-noop-fallback
          fetch-depth: 0

      - name: Remove dead state and clean ignored candidate output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          workflow_path = Path('.github/workflows/hourly-product-development.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = replace_once(
              workflow,
              '          completed_without_mutation=0\n',
              '',
              'dead no-op counter initialization',
          )
          workflow = replace_once(
              workflow,
              '              completed_without_mutation=$((completed_without_mutation + 1))\n',
              '',
              'dead no-op counter increment',
          )
          workflow = replace_once(
              workflow,
              '            git clean -fd\n',
              '            git clean -fdx -e /opencode.json\n',
              'candidate cleanup command',
          )
          workflow_path.write_text(workflow, encoding='utf-8')

          test_path = Path('tests/hourly-noop-fallback-contract.test.js')
          tests = test_path.read_text(encoding='utf-8')
          tests = replace_once(
              tests,
              "  await writeFile(join(workspace, 'product.txt'), 'baseline\\n', 'utf8');\n",
              "  await writeFile(join(workspace, 'product.txt'), 'baseline\\n', 'utf8');\n"
              "  await writeFile(\n"
              "    join(workspace, '.gitignore'),\n"
              "    'ignored-output.txt\\nopencode.json\\n',\n"
              "    'utf8',\n"
              "  );\n"
              "  await writeFile(join(workspace, 'opencode.json'), 'trusted config\\n', 'utf8');\n",
              'fixture ignored files',
          )
          tests = replace_once(
              tests,
              "  fail*)\n    printf 'partial\\\\n' >\"$GITHUB_WORKSPACE/junk-$model.txt\"\n    exit 1\n",
              "  fail*)\n"
              "    printf 'partial\\\\n' >\"$GITHUB_WORKSPACE/junk-$model.txt\"\n"
              "    printf 'ignored partial\\\\n' >\"$GITHUB_WORKSPACE/ignored-output.txt\"\n"
              "    exit 1\n",
              'failed candidate ignored output',
          )
          tests = replace_once(
              tests,
              "  metadata)\n    printf 'metadata-only\\\\n' >\"$GITHUB_WORKSPACE/PR_MESSAGE.md\"\n    exit 0\n",
              "  metadata)\n"
              "    printf 'metadata-only\\\\n' >\"$GITHUB_WORKSPACE/PR_MESSAGE.md\"\n"
              "    printf 'ignored no-op\\\\n' >\"$GITHUB_WORKSPACE/ignored-output.txt\"\n"
              "    exit 0\n",
              'no-op candidate ignored output',
          )
          tests = replace_once(
              tests,
              "  runRequired('git', ['add', 'product.txt'], { cwd: workspace });\n",
              "  runRequired('git', ['add', '.gitignore', 'product.txt'], {\n"
              "    cwd: workspace,\n"
              "  });\n",
              'fixture baseline add',
          )
          tests = replace_once(
              tests,
              "  assertOrdered(modelScript, [\n    'completed_without_mutation=0',\n",
              "  assert.doesNotMatch(modelScript, /completed_without_mutation/);\n"
              "  assertOrdered(modelScript, [\n",
              'remove dead counter assertion',
          )
          tests = replace_once(
              tests,
              "    'break',\n    'completed_without_mutation=$((completed_without_mutation + 1))',\n    'git reset --hard HEAD',\n    'git clean -fd',\n",
              "    'break',\n"
              "    'git reset --hard HEAD',\n"
              "    'git clean -fdx -e /opencode.json',\n",
              'cleanup ordering assertion',
          )
          tests = replace_once(
              tests,
              "    await assert.rejects(readFile(join(harness.workspace, 'PR_MESSAGE.md')));\n    assert.match(\n",
              "    await assert.rejects(readFile(join(harness.workspace, 'PR_MESSAGE.md')));\n"
              "    await assert.rejects(\n"
              "      readFile(join(harness.workspace, 'ignored-output.txt')),\n"
              "    );\n"
              "    assert.equal(\n"
              "      await readFile(join(harness.workspace, 'opencode.json'), 'utf8'),\n"
              "      'trusted config\\n',\n"
              "    );\n"
              "    assert.match(\n",
              'ignored cleanup evidence',
          )
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Verify focused executable contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/hourly-noop-fallback-contract.test.js

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify complete repository
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          node scripts/check-package-contents.mjs

      - name: Commit verified hardening without retaining this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/harden-hourly-candidate-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ci): purge ignored candidate residue"
          verified_commit_sha="$(git rev-parse HEAD)"
          echo "VERIFIED_COMMIT_SHA=$verified_commit_sha"
          echo "Verified commit: $verified_commit_sha" >>"$GITHUB_STEP_SUMMARY"
          git push origin HEAD:fix/hourly-product-noop-fallback
