name: Hierarchical Delimited Label Fix

on:
  push:
    branches:
      - agent/hierarchical-document-symbols
    paths:
      - .github/workflows/hierarchical-delimited-label-fix.yml

permissions:
  contents: read

concurrency:
  group: diagramweave-hierarchical-delimited-label-fix
  cancel-in-progress: true

jobs:
  patch-verify-and-clean:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/hierarchical-document-symbols
          fetch-depth: 0
          persist-credentials: true

      - name: Mask supported delimited labels before brace matching
        shell: python
        run: |
          from pathlib import Path

          path = Path("packages/language-server/src/symbols.js")
          text = path.read_text(encoding="utf-8")
          marker = """/**
           * Choose the displayed label from a declaration and optional `as` alias.
          """
          helper = """/**
           * Replace one complete delimited label token with spaces.
           *
           * Every supported opening delimiter is one UTF-16 code unit. Masking the
           * delimiter and label body preserves later source coordinates while preventing
           * displayed braces from entering the structural scope stack.
           *
           * @param {string[]} characters - Mutable declaration remainder code units.
           * @param {{selectionStart: number, tokenEnd: number, delimited: boolean}|null} token - Parsed label token.
           * @returns {void}
           */
          function maskDelimitedToken(characters, token) {
            if (token?.delimited === true) {
              characters.fill(' ', token.selectionStart - 1, token.tokenEnd);
            }
          }

          /**
           * Mask supported quoted, parenthesized, bracketed, and colon labels.
           *
           * @param {string} remainder - Declaration text following its keyword.
           * @returns {string} Same-length remainder with complete delimited labels masked.
           */
          function maskDelimitedLabels(remainder) {
            const characters = remainder.split('');
            const first = parseLabelToken(remainder);
            if (first === null) {
              return remainder;
            }
            maskDelimitedToken(characters, first);
            if (!first.delimited) {
              const aliasMatch = /^\\s+as\\s+/diu.exec(remainder.slice(first.tokenEnd));
              if (aliasMatch !== null) {
                const secondStart = first.tokenEnd + aliasMatch[0].length;
                maskDelimitedToken(characters, parseLabelToken(remainder, secondStart));
              }
            }
            return characters.join('');
          }

          /**
           * Choose the displayed label from a declaration and optional `as` alias.
          """
          count = text.count(marker)
          if count != 1:
              raise SystemExit(f"expected one label-selection marker, found {count}")
          text = text.replace(marker, helper)

          old = """    const braces = structuralBraces(code);
          """
          new = """    const structuralCode = match === null
              ? code
              : `${code.slice(0, match.indices[4][0])}${maskDelimitedLabels(match[4])}`;
            const braces = structuralBraces(structuralCode);
          """
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one structural-brace call, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Set up Node.js 24
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked workspace
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify hierarchy tests
        run: node --test packages/language-server/test/hierarchical-symbols.test.js packages/language-server/test/symbols.test.js

      - name: Verify complete repository
        run: npm run verify

      - name: Verify package contents
        run: node scripts/check-package-contents.mjs

      - name: Remove one-shot workflow and push verified tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hierarchical-delimited-label-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/language-server/src/symbols.js .github/workflows/hierarchical-delimited-label-fix.yml
          git diff --cached --check
          git commit -m "fix(language-server): ignore braces inside delimited labels"
          git push origin HEAD:agent/hierarchical-document-symbols
