name: Hierarchical Symbol Documentation Sync

on:
  push:
    branches:
      - agent/hierarchical-document-symbols
    paths:
      - .github/workflows/hierarchical-symbol-doc-sync.yml

permissions:
  contents: read

concurrency:
  group: diagramweave-hierarchical-symbol-doc-sync
  cancel-in-progress: true

jobs:
  patch-and-clean:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/hierarchical-document-symbols
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize hierarchical outline records
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "README.md",
              """The session uses full-document synchronization, local file-URI identifiers,
          source-free renderer diagnostics, exact version/generation checks, bounded
          immutable `textDocument/documentSymbol` results, and capability-gated
          `textDocument/completion`. The outline recognizes high-signal explicit
          PlantUML declarations while deliberately ignoring implicit or malformed
          constructs. Completion filters the same declaration families from a fixed local
          catalog and returns exact UTF-16 text edits only at safe line-leading prefixes.
          It performs no LLM, renderer, file, include, macro, workspace, or network work.
          Studio, IDE extensions, naruon, and other CWL hosts reuse this package without
          importing a process transport.
          """,
              """The session uses full-document synchronization, local file-URI identifiers,
          source-free renderer diagnostics, exact version/generation checks, bounded
          immutable `textDocument/documentSymbol` trees, and capability-gated
          `textDocument/completion`. The outline recognizes high-signal explicit
          PlantUML declarations and adds `children` only for complete unquoted brace
          scopes with stack-ordered, indentation-matched standalone closers. Ambiguous,
          unmatched, quoted, commented, macro, include, and renderer-dependent structure
          remains flat. Completion filters the same declaration families from a fixed
          local catalog and returns exact UTF-16 text edits only at safe line-leading
          prefixes. It performs no LLM, renderer, file, include, macro, workspace, or
          network work. Studio, IDE extensions, naruon, and other CWL hosts reuse this
          package without importing a process transport.
          """,
          )
          replace_once(
              "README.md",
              """- **DiagramWeave Studio:** manual source editor, preview, diagnostics, outline, completion, Context Inspector, diff review, recovery, and accessible approval flows;
          - **DiagramWeave Renderer:** implemented local PlantUML package with stdin-only rendering, `SANDBOX`, metadata suppression, bounded resources, safe line diagnostics, and local and remote includes unavailable;
          - **DiagramWeave Language Server:** implemented diagnostics, document outlines, deterministic declaration completion, and bounded stdio integration reusable by Studio and external IDEs;
          """,
              """- **DiagramWeave Studio:** manual source editor, preview, diagnostics, hierarchical outline, completion, Context Inspector, diff review, recovery, and accessible approval flows;
          - **DiagramWeave Renderer:** implemented local PlantUML package with stdin-only rendering, `SANDBOX`, metadata suppression, bounded resources, safe line diagnostics, and local and remote includes unavailable;
          - **DiagramWeave Language Server:** implemented diagnostics, conservative hierarchical document outlines, deterministic declaration completion, and bounded stdio integration reusable by Studio and external IDEs;
          """,
          )
          replace_once(
              "README.md",
              """8. Outline and completion records are derived only from sanitized accepted open-document snapshots and are never inferred from remote content.
          9. Declaration completion fails by omission in comments, strings, relations, directives, completed declarations, and ambiguous cursor positions.
          10. The user remains responsible for accepting, rejecting, saving, and committing changes.
          """,
              """8. Outline and completion records are derived only from sanitized accepted open-document snapshots and are never inferred from remote content.
          9. Outline hierarchy requires complete stack-ordered braces with matching indentation; ambiguous or malformed structure remains flat.
          10. Declaration completion fails by omission in comments, strings, relations, directives, completed declarations, and ambiguous cursor positions.
          11. The user remains responsible for accepting, rejecting, saving, and committing changes.
          """,
          )
          replace_once(
              "README.md",
              """- [Declaration-completion product slice](docs/product/declaration-completion.md)
          - [Architecture](docs/architecture.md)
          """,
              """- [Declaration-completion product slice](docs/product/declaration-completion.md)
          - [Hierarchical-outline product slice](docs/product/hierarchical-document-outline.md)
          - [Architecture](docs/architecture.md)
          """,
          )
          replace_once(
              "README.md",
              """- [PlantUML declaration-completion research](docs/research/plantuml-declaration-completion.md)
          - [Contextual Orchestrator operations](docs/operations/contextual-orchestrator.md)
          """,
              """- [PlantUML declaration-completion research](docs/research/plantuml-declaration-completion.md)
          - [PlantUML hierarchical-symbol research](docs/research/plantuml-hierarchical-document-symbols.md)
          - [Contextual Orchestrator operations](docs/operations/contextual-orchestrator.md)
          """,
          )
          replace_once(
              "README.md",
              """- [Declaration-completion operations](docs/operations/declaration-completion.md)
          - [DiagramWeave Language Server](packages/language-server/README.md)
          """,
              """- [Declaration-completion operations](docs/operations/declaration-completion.md)
          - [Hierarchical document-symbol operations](docs/operations/hierarchical-document-symbols.md)
          - [DiagramWeave Language Server](packages/language-server/README.md)
          """,
          )

          replace_once(
              "docs/architecture.md",
              """DiagramWeave is a source-first editor platform for PlantUML and future text diagram languages. The architecture protects manual editing as the authoritative workflow while making LLM output reviewable, revision-bound, and replaceable. The implemented foundation contains a portable trust kernel, a Contextual Orchestrator adapter, an isolated local PlantUML renderer, safe structured diagnostics, a deterministic CLI, a transport-neutral Language Server, bounded JSON-RPC stdio integration, explicit document symbols, and deterministic declaration completion. It still contains no database, desktop shell, or hidden document store; future surfaces must reuse these boundaries rather than reimplement them.
          """,
              """DiagramWeave is a source-first editor platform for PlantUML and future text diagram languages. The architecture protects manual editing as the authoritative workflow while making LLM output reviewable, revision-bound, and replaceable. The implemented foundation contains a portable trust kernel, a Contextual Orchestrator adapter, an isolated local PlantUML renderer, safe structured diagnostics, a deterministic CLI, a transport-neutral Language Server, bounded JSON-RPC stdio integration, conservative hierarchical document symbols, and deterministic declaration completion. It still contains no database, desktop shell, or hidden document store; future surfaces must reuse these boundaries rather than reimplement them.
          """,
          )
          replace_once(
              "docs/architecture.md",
              """9. **Editor intelligence fails by omission.** Document symbols and declaration completion recognize only explicit high-signal syntax and do not invent semantics from relations, includes, macros, malformed source, or remote content.
          10. **Composed layers retain independent evidence.** Diagnostics, document symbols, and completion own separate state and tests so an outer feature cannot hide regressions in an inner layer.
          """,
              """9. **Editor intelligence fails by omission.** Document symbols and declaration completion recognize only explicit high-signal syntax and do not invent semantics from relations, includes, macros, malformed source, or remote content.
          10. **Hierarchy requires complete structural evidence.** Only stack-ordered declaration braces with identical opening and closing indentation create children; ambiguous or incomplete source remains flat.
          11. **Composed layers retain independent evidence.** Diagnostics, document symbols, and completion own separate state and tests so an outer feature cannot hide regressions in an inner layer.
          """,
          )
          replace_once(
              "docs/architecture.md",
              """- provide conservative declaration-order `textDocument/documentSymbol` results;
          - advertise and serve deterministic `textDocument/completion` only to clients that declare completion support;
          """,
              """- provide conservative source-order `textDocument/documentSymbol` trees with optional proven children and enclosing parent ranges;
          - advertise and serve deterministic `textDocument/completion` only to clients that declare completion support;
          """,
          )
          replace_once(
              "docs/architecture.md",
              """Each wrapper delegates lifecycle and inner features while owning only the source required by its feature. Direct unit tests cover every layer independently, even though the public entry point exposes the outer completion session.

          Declaration completion uses a fixed catalog, LSP keyword CompletionItems, plain-text insertion, stable order, and explicit text edits. It returns no result in comments, quoted labels, relations, directives, completed declarations, or the middle of an existing keyword. It does not call an LLM, renderer, filesystem, workspace index, include processor, macro processor, or network service.
          """,
              """Each wrapper delegates lifecycle and inner features while owning only the source required by its feature. Direct unit tests cover every layer independently, even though the public entry point exposes the outer completion session.

          Document-symbol hierarchy is computed locally after explicit declaration parsing. One unmatched unquoted declaration brace may become a parent only when it is closed in stack order by a standalone brace with identical indentation. Quoted, commented, balanced one-line, unmatched, multi-open, cross-indented, and crossed structure remains flat. Parent ranges extend through proven close lines, roots and siblings preserve source order, and the frozen tree is constructed bottom-up without recursive product traversal.

          Declaration completion uses a fixed catalog, LSP keyword CompletionItems, plain-text insertion, stable order, and explicit text edits. It returns no result in comments, quoted labels, relations, directives, completed declarations, or the middle of an existing identifier. It does not call an LLM, renderer, filesystem, workspace index, include processor, macro processor, or network service.
          """,
          )
          replace_once(
              "docs/architecture.md",
              """4. A document-symbol request scans explicit declarations and masks comments without shifting UTF-16 offsets.
          5. The layer returns a bounded frozen declaration-order outline or a stable source-free error.
          6. Later accepted changes replace the snapshot; close and lifecycle invalidation remove it.
          """,
              """4. A document-symbol request scans explicit declarations and masks comments without shifting UTF-16 offsets.
          5. A bounded structural pass matches only complete stack-ordered declaration braces with identical opening and closing indentation.
          6. Matched intervals receive source-order children and enclosing ranges; ambiguous and incomplete structure remains flat.
          7. The layer freezes children bottom-up and returns bounded source-order roots or a stable source-free error.
          8. Later accepted changes replace the snapshot; close and lifecycle invalidation remove it.
          """,
          )
          replace_once(
              "docs/architecture.md",
              """- Diagnostics, document symbols, and completion remain transport-neutral contracts reusable by CLI, Studio, IDEs, naruon, and service wrappers.
          """,
              """- Diagnostics, hierarchical document symbols, and completion remain transport-neutral contracts reusable by CLI, Studio, IDEs, naruon, and service wrappers.
          """,
          )
          replace_once(
              "docs/architecture.md",
              """- Public error codes, diagnostic fields, proposal schema version, Language Server capabilities, completion item shape, and package exports are compatibility contracts.
          - A breaking proposal, diagnostic, symbol, or completion schema requires an explicit version and migration guidance.
          """,
              """- Public error codes, diagnostic fields, proposal schema version, Language Server capabilities, document-symbol hierarchy, completion item shape, and package exports are compatibility contracts.
          - A breaking proposal, diagnostic, symbol-tree, or completion schema requires an explicit version and migration guidance.
          """,
          )

          replace_once(
              "docs/product/diagramweave-prd.md",
              """FR-011의 문서 심볼·개요와 선언 키워드 자동완성 foundation 범위는 구현됐다. LSP 3.18 `textDocument/documentSymbol`은 명시적 PlantUML 선언을 선언 순서의 immutable UTF-16 range로 반환하며, capability-gated `textDocument/completion`은 안전한 줄 선두 접두사에 결정론적 UTF-16 `textEdit`를 제공한다. Studio·IDE·`dweave-lsp`·naruon에서 동일한 세션을 재사용하며 implicit participant, 관계 endpoint, member, macro, include, malformed 선언과 모호한 자동완성 문맥은 추측하지 않는다.
          """,
              """FR-011의 계층형 문서 심볼·개요와 선언 키워드 자동완성 foundation 범위는 구현됐다. LSP 3.18 `textDocument/documentSymbol`은 명시적 PlantUML 선언을 source-order immutable UTF-16 tree로 반환하고, 완전한 unquoted brace scope와 동일 indentation의 standalone close가 입증된 경우에만 `children`과 enclosing parent range를 제공한다. capability-gated `textDocument/completion`은 안전한 줄 선두 접두사에 결정론적 UTF-16 `textEdit`를 제공한다. Studio·IDE·`dweave-lsp`·naruon에서 동일한 세션을 재사용하며 implicit participant, 관계 endpoint, member, macro, include, renderer-dependent syntax, malformed 선언, 불완전 hierarchy와 모호한 자동완성 문맥은 추측하지 않는다.
          """,
          )
          replace_once(
              "docs/product/diagramweave-prd.md",
              """FR-072의 진단·문서 심볼·선언 키워드 자동완성·stdio foundation 범위도 구현됐다. bounded JSON-RPC transport와 transport-neutral session이 같은 UTF-16 진단, document-symbol 및 capability-gated completion 계약을 제공한다. completion resolve, semantic member completion, hover, definition, references, rename과 workspace indexing은 아직 구현되지 않았다.
          """,
              """FR-072의 진단·계층형 문서 심볼·선언 키워드 자동완성·stdio foundation 범위도 구현됐다. bounded JSON-RPC transport와 transport-neutral session이 같은 UTF-16 진단, conservative document-symbol tree 및 capability-gated completion 계약을 제공한다. legacy flat-only symbol fallback, completion resolve, semantic member completion, hover, definition, references, rename과 workspace indexing은 아직 구현되지 않았다.
          """,
          )

      - name: Verify synchronized records
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'conservative hierarchical document symbols' docs/architecture.md
          grep -F '계층형 문서 심볼·개요와 선언 키워드 자동완성 foundation 범위는 구현됐다' docs/product/diagramweave-prd.md
          grep -F 'Hierarchical-outline product slice' README.md
          grep -F 'PlantUML hierarchical-symbol research' README.md
          grep -F 'Hierarchical document-symbol operations' README.md
          git diff --check

      - name: Remove one-shot workflow and push synchronized tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hierarchical-symbol-doc-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/architecture.md docs/product/diagramweave-prd.md .github/workflows/hierarchical-symbol-doc-sync.yml
          git diff --cached --check
          git commit -m "docs: integrate hierarchical document symbols"
          git push origin HEAD:agent/hierarchical-document-symbols
